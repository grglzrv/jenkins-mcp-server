version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # These files are generated by pip-compile. Update dependency intent in
    # pyproject.toml and let `make lock` regenerate one resolver-consistent,
    # hash-locked dependency set instead of independently bumping transitive pins.
    exclude-paths:
      - "requirements/*.txt"
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
