# k3s smoke values for the minibridge proxy. Mirrors
# examples/values/minibridge.yaml so the test exercises the documented
# configuration rather than a special case.
jenkins:
  url: https://jenkins.smoke.invalid
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    existingSecret:
      enabled: true
      name: jenkins-mcp-secrets
      usernameKey: JENKINS_USERNAME
      tokenKey: JENKINS_TOKEN

replicaCount: 2

ingress:
  enabled: false

minibridge:
  enabled: true
  # The probe below uses the MCP 2025-03-26 Streamable HTTP client at /mcp.
  mode: http
  tools:
    # integration/minibridge_probe.py asserts these are hidden and refused.
    deny: ["@destructive"]
    allow: []
  methodsDeny: []
  guardrails:
    - covert-instruction-detection
    - sensitive-pattern-detection
    - shadowing-pattern-detection
    - schema-misuse-prevention
    - cross-origin-tool-access
    - secrets-redaction
  policer:
    enforce: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 384Mi

mcp:
  allowedJobs: "*"
  maxRequestBytes: 10000000
  maxResponseBytes: 10000000

# Minibridge exposes its own health endpoint, while server audit JSONL remains
# in process logs. Keep the optional file copy explicit and disabled here.
audit:
  fileEnabled: false
  requiredForReadiness: false
  maxFileBytes: 52428800
  backupCount: 3
