name: Jenkins integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "integration/**"
      - "docker-compose.integration.yml"
      - "Dockerfile"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jenkins-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install 'mcp>=1.28,<2'
      - name: Run Jenkins TLS integration suite
        run: ./integration/run.sh
