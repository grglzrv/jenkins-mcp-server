name: PR dependency maintenance

on:
  push:
    branches:
      - dependabot/pip/python-dependencies-d6ef873569

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/pip/python-dependencies-d6ef873569
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply reviewed MCP compatibility and release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('src/jenkins_mcp_server/server.py')
          text = server.read_text(encoding='utf-8')
          old_import = 'from mcp.server.mcpserver import MCPServer'
          new_import = 'from mcp.server import MCPServer'
          if text.count(old_import) != 1:
              raise SystemExit(f'expected exactly one legacy MCPServer import, found {text.count(old_import)}')
          server.write_text(text.replace(old_import, new_import), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          start = text.index('## [Unreleased]\n')
          end = text.index('\n## [2.10.6]', start)
          notes = [
              '## [Unreleased]',
              '',
              '### Highlights',
              '',
              '- Refresh the MCP, Pydantic, Ruff, and Python build dependency set while preserving Jenkins, transport, Helm, Kubernetes, and Minibridge behavior.',
              '',
              '### New Features',
              '',
              '- None.',
              '',
              '### Improvements',
              '',
              '- Upgrade MCP to 2.1.1, Pydantic to 2.13.5, Ruff to 0.16.6, and build to 1.6.0.',
              "- Use MCP v2's public `mcp.server.MCPServer` import instead of its implementation-module path.",
              '- Regenerate the hash-checked runtime dependency lock with matching `mcp-types` 2.1.1 and `pydantic-core` 2.46.5 releases.',
              '',
              '### Bug Fixes',
              '',
              '- Keep the offline Docker wheel set resolver-consistent with package metadata so image builds do not retain MCP 2.0.0 after the minimum runtime requirement moves to MCP 2.1.1.',
              '',
              '### Breaking Changes',
              '',
              '- None.',
              '',
              '### Known Issues',
              '',
              '- None.',
              '',
              '### Security',
              '',
              '- Preserve hash-checked container installs and the existing dependency-review, CodeQL, and pip-audit guardrails for the refreshed dependency set.',
              '',
              '### Upgrade Notes',
              '',
              '- No Jenkins, MCP transport, Minibridge, Kubernetes, Helm, credential, ingress, or policy configuration change is required.',
              '',
          ]
          replacement = '\n'.join(notes)
          changelog.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Regenerate deterministic dependency locks
        run: make lock

      - name: Prepare patch release
        run: make version VERSION=2.10.7

      - name: Verify generated state
        shell: bash
        run: |
          make verify-lock
          make verify-version
          python - <<'PY'
          from pathlib import Path
          lock = Path('requirements/runtime.txt').read_text(encoding='utf-8')
          expected = ('mcp==2.1.1', 'mcp-types==2.1.1', 'pydantic==2.13.5', 'pydantic-core==2.46.5')
          missing = [pin for pin in expected if pin not in lock]
          if missing:
              raise SystemExit(f'missing refreshed lock pins: {missing}')
          PY

      - name: Commit reviewed generated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr-dependency-maintenance.yml
          git add -A
          git diff --cached --check
          git commit -m 'build: refresh dependency lock and release metadata'
          git push origin HEAD:dependabot/pip/python-dependencies-d6ef873569
