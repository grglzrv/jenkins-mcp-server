name: Prepare PR 59 dependency release

on:
  push:
    branches:
      - dependabot/pip/python-dependencies-0e3b0fb404

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/pip/python-dependencies-0e3b0fb404
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Prepare 2.10.4 release and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.10.3"
          grep -F 'pydantic-settings>=2.15.0,<3' pyproject.toml
          grep -F 'uvicorn>=0.52.3,<1' pyproject.toml
          grep -F 'ruff>=0.16.3' pyproject.toml
          grep -F 'hatchling>=1.32.0' pyproject.toml

          cat > /tmp/pr59-unreleased.md <<'EOF'
          ## [Unreleased]

          ### Highlights

          - The Python runtime and build toolchain are refreshed to current compatible
            releases while preserving the existing Jenkins MCP configuration and tool
            contracts.

          ### New Features

          - None.

          ### Improvements

          - Upgrade `pydantic-settings` to 2.15.0, `uvicorn` to 0.52.3, `ruff` to 0.16.3,
            and Hatchling to 1.32.0.
          - Uvicorn 0.52.3 includes an updated HTTP/1.1 parser path intended to improve
            request parsing performance.
          - `pydantic-settings` 2.15.0 now applies `case_sensitive` consistently to init
            kwargs and config-file sources as well as environment settings.

          ### Bug Fixes

          - None in Jenkins MCP Server source code.

          ### Breaking Changes

          - None.

          ### Known Issues

          - None known.

          ### Security

          - The server's explicit `case_sensitive=True` settings policy remains enforced,
            so mixed/lowercase duplicates cannot override documented uppercase settings;
            regression coverage now includes programmatic initialization under the new
            `pydantic-settings` behavior.
          - `pydantic-settings` 2.15.0 also prevents nested secret-directory sources from
            following symlinks outside their configured secrets directory. Jenkins MCP
            Server does not currently use that source directly, but ships the hardened
            dependency version.

          ### Upgrade Notes

          - No configuration or migration action is required. Upgrade the application and
            Helm chart together as usual.
          EOF

          python - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          start = text.index("## [Unreleased]\n")
          end = text.index("\n## [2.10.3]", start)
          unreleased = Path("/tmp/pr59-unreleased.md").read_text(encoding="utf-8")
          changelog.write_text(text[:start] + unreleased + text[end:], encoding="utf-8")

          test_path = Path("tests/test_config.py")
          tests = test_path.read_text(encoding="utf-8")
          if "test_init_keyword_aliases_are_case_sensitive" not in tests:
              tests = tests.replace(
                  "import pytest\n\nfrom jenkins_mcp_server.config import Settings\n",
                  "import pytest\nfrom pydantic import ValidationError\n\nfrom jenkins_mcp_server.config import Settings\n",
              )
              tests += (
                  "\n\n\ndef test_init_keyword_aliases_are_case_sensitive(\n"
                  "    monkeypatch: pytest.MonkeyPatch,\n"
                  ") -> None:\n"
                  "    for name in (\"JENKINS_URL\", \"JENKINS_USERNAME\", \"JENKINS_TOKEN\"):\n"
                  "        monkeypatch.delenv(name, raising=False)\n\n"
                  "    with pytest.raises(ValidationError):\n"
                  "        Settings(\n"
                  "            Jenkins_URL=\"https://jenkins.test\",\n"
                  "            Jenkins_USERNAME=\"user\",\n"
                  "            Jenkins_TOKEN=\"token\",\n"
                  "        )\n"
              )
              test_path.write_text(tests, encoding="utf-8")
          PY

          make version VERSION=2.10.4
          python -m pip install -e '.[dev]'
          ruff check .
          mypy src/
          pytest -q tests/test_config.py
          python scripts/check_version.py
          python scripts/changelog.py validate

          rm .github/workflows/prepare-pr59.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare 2.10.4 dependency release"
          git push origin HEAD:dependabot/pip/python-dependencies-0e3b0fb404
