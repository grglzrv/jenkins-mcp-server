name: Jenkins compatibility matrix

# Answers "which Jenkins versions actually work" empirically rather than by
# reading changelogs. Not part of CI: it is slow, and older cores are expected
# to fail, so failures here are data rather than a broken build.
on:
  workflow_dispatch:
    inputs:
      extra_image:
        description: "Additional Jenkins image to test, e.g. jenkins/jenkins:2.504.1-jdk21"
        required: false
        type: string
      legacy:
        description: "Resolve plugins from the core's own update centre line. Needed for cores older than the newest plugins support."
        required: false
        default: true
        type: boolean
  schedule:
    # Monthly, to catch the current LTS moving underneath us.
    - cron: "0 5 1 * *"

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.image }}
    # A targeted run against extra_image skips the full sweep, so testing one
    # specific core does not take twenty minutes of unrelated jobs with it.
    if: inputs.extra_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Old cores are expected to fail; record the result instead of stopping.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image:
          # Current LTS, what the normal suite uses.
          - jenkins/jenkins:lts-jdk21
          # Previous LTS line, to catch regressions against slightly older cores.
          - jenkins/jenkins:2.541.3-jdk21
          # Java 11 baseline era.
          - jenkins/jenkins:2.401.3
          # Older still, before jenkins-plugin-cli existed.
          - jenkins/jenkins:2.319.3
          # Older cores whose Debian bases are archived cannot apt-get, and
          # jenkins/jenkins:2.50 is not a published tag. Both were dropped: they
          # produce build failures that say nothing about this server.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install 'mcp>=2.0.0,<3'
      - name: Run the integration suite against ${{ matrix.image }}
        id: run
        env:
          JENKINS_IMAGE: ${{ matrix.image }}
        run: |
          set +e
          ./integration/run.sh > /tmp/out.txt 2>&1
          code=$?
          set -e
          tail -n 120 /tmp/out.txt
          if [ "$code" -ne 0 ]; then
            # Emit the cause as an annotation. Job logs live in blob storage that
            # is awkward to fetch; annotations come back from the check-runs API,
            # so the reason a core failed is readable without downloading logs.
            # The plugin resolver's own error appears early in the log, while
            # the docker failure appears at the end. Report both.
            cause="$(grep -aiE 'requires a greater version|not found|unable to|cannot|exception|no such|failed to download|IOException' /tmp/out.txt | head -8 | cut -c1-180 | tr '\n' '~')"
            reason="CAUSE: ${cause:-none matched} || TAIL: $(tail -c 700 /tmp/out.txt | tr '\n' '~' | tr -s ' ')"
            echo "::error::${JENKINS_IMAGE} FAILED :: ${reason:-no recognisable error line, see log}"
          fi
          exit "$code"
      - name: Result
        if: always()
        run: |
          echo "### ${{ matrix.image }}: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  extra:
    name: ${{ inputs.extra_image }}
    if: inputs.extra_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install 'mcp>=2.0.0,<3'
      - name: Run the integration suite against ${{ inputs.extra_image }}
        env:
          JENKINS_IMAGE: ${{ inputs.extra_image }}
          JENKINS_DOCKERFILE: ${{ inputs.legacy && 'Dockerfile.legacy' || 'Dockerfile' }}
        run: |
          set +e
          ./integration/run.sh > /tmp/out.txt 2>&1
          code=$?
          set -e
          tail -n 120 /tmp/out.txt
          if [ "$code" -ne 0 ]; then
            # The plugin resolver's own error appears early in the log, while
            # the docker failure appears at the end. Report both.
            cause="$(grep -aiE 'requires a greater version|not found|unable to|cannot|exception|no such|failed to download|IOException' /tmp/out.txt | head -8 | cut -c1-180 | tr '\n' '~')"
            reason="CAUSE: ${cause:-none matched} || TAIL: $(tail -c 700 /tmp/out.txt | tr '\n' '~' | tr -s ' ')"
            echo "::error::${JENKINS_IMAGE} FAILED :: ${reason:-no recognisable error line}"
          else
            echo "::notice::${JENKINS_IMAGE} PASSED the full integration suite"
          fi
          exit "$code"

  legacy:
    name: "legacy ${{ matrix.image }}"
    # Older cores cannot install the newest plugins, which now require a newer
    # core than they are. This job resolves plugins from each core's own update
    # centre line instead. Separate from the sweep so the default suite and the
    # standard Dockerfile stay untouched.
    if: inputs.extra_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image:
          # The 2.504 LTS line. 2.504.3 builds; 2.504.1 cannot, because current
          # plugins require 2.504.3 and the retired 2.504 update centre 404s.
          - jenkins/jenkins:2.504.3-jdk21
          - jenkins/jenkins:2.504.1-jdk21
          - jenkins/jenkins:2.492.3-jdk21
          - jenkins/jenkins:2.462.3-jdk21
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install 'mcp>=2.0.0,<3'
      - name: Run the integration suite against ${{ matrix.image }}
        env:
          JENKINS_IMAGE: ${{ matrix.image }}
          JENKINS_DOCKERFILE: Dockerfile.legacy
        run: |
          set +e
          ./integration/run.sh > /tmp/out.txt 2>&1
          code=$?
          set -e
          tail -n 120 /tmp/out.txt
          if [ "$code" -ne 0 ]; then
            # The plugin resolver's own error appears early in the log, while
            # the docker failure appears at the end. Report both.
            cause="$(grep -aiE 'requires a greater version|not found|unable to|cannot|exception|no such|failed to download|IOException' /tmp/out.txt | head -8 | cut -c1-180 | tr '\n' '~')"
            reason="CAUSE: ${cause:-none matched} || TAIL: $(tail -c 700 /tmp/out.txt | tr '\n' '~' | tr -s ' ')"
            echo "::error::${JENKINS_IMAGE} FAILED :: ${reason:-see log}"
          else
            echo "::notice::${JENKINS_IMAGE} PASSED with update-centre-pinned plugins"
          fi
          exit "$code"
