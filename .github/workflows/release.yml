name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    paths:
      - VERSION
  workflow_call:
    inputs:
      version:
        description: "Version to publish; defaults to VERSION at source_ref"
        required: false
        type: string
      source_ref:
        description: "Commit or ref containing the application and chart to publish"
        required: false
        type: string
      notes_ref:
        description: "Commit or ref containing the curated changelog entry"
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jenkins-mcp-server
  HELM_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      publish: ${{ steps.release_state.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(cat VERSION)}"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "${tag}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test "${version}" = "$(cat VERSION)"
          make verify-version
      - name: Check whether the release already exists
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected GitHub Releases API status: $status" >&2; exit 1 ;;
          esac
      - name: Test and build package
        if: steps.release_state.outputs.publish == 'true'
        run: |
          pip install -e '.[dev]'
          ruff check .
          pytest -q
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        if: steps.release_state.outputs.publish == 'true'
        with:
          name: python-dist
          path: dist/*

  image:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.version, '-') }}
      - name: Build and publish amd64/arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Linked Artifact storage records currently require an organization-owned repository.
          create-storage-record: false

  minibridge-image:
    # The -minibridge variant, built from docker/Dockerfile.minibridge. The chart
    # selects it by appending minibridge.image.tagSuffix to the app version, so
    # this tag must exist or minibridge deployments ImagePullBackOff.
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Same versions as the default image with a -minibridge suffix, so
          # 1.14.0 -> 1.14.0-minibridge and latest -> latest-minibridge.
          flavor: |
            suffix=-minibridge,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.version, '-') }}
      - name: Build and publish amd64/arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.minibridge
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  helm:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Lint, render, and package
        run: |
          helm lint --strict charts/jenkins-mcp-server
          # jenkins.url is required, so a render with no values must fail.
          if helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp > /tmp/nourl.yaml 2>&1; then
            echo "expected the render to fail without jenkins.url"; exit 1
          fi
          grep -q "jenkins.url is required" /tmp/nourl.yaml
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
            --set jenkins.url=https://jenkins.example.com > /tmp/default.yaml
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp -f examples/values/tailscale-production.yaml > /tmp/production.yaml
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp -f examples/values/external-secrets-gcp-workload-identity.yaml > /tmp/gcp.yaml
          mkdir -p dist
          helm package charts/jenkins-mcp-server --destination dist
          sha256sum dist/*.tgz > dist/SHA256SUMS
      - name: Log in to GHCR for Helm
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish Helm OCI chart
        run: helm push "dist/jenkins-mcp-server-${{ needs.validate.outputs.version }}.tgz" "oci://${{ env.HELM_REGISTRY }}"
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*

  chart-smoke:
    # The release must not publish a chart that cannot install. Same reusable
    # workflow CI runs, so the steps are defined once.
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    uses: ./.github/workflows/chart-smoke.yml
    with:
      # The two newest supported minors; CI covers the full range on every push.
      k3s_versions: '["v1.36.2+k3s1","v1.35.6+k3s1"]'
      source_ref: ${{ needs.validate.outputs.source_sha }}

  github-release:
    needs: [validate, image, minibridge-image, helm, chart-smoke]
    if: >-
      ${{ always() && needs.validate.outputs.publish == 'true' &&
          needs.image.result == 'success' &&
          needs.minibridge-image.result == 'success' &&
          needs.helm.result == 'success' &&
          needs.chart-smoke.result == 'success' }}
    permissions:
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
      # Declaring any permissions sets every unlisted scope to none, and
      # download-artifact needs actions:read to enumerate the run's artifacts.
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.notes_ref || needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          # Only the real release assets. Without a pattern this also pulls the
          # .dockerbuild build-summary artifact that docker/build-push-action
          # uploads, which fails to extract and would otherwise be attached to
          # the release.
          pattern: "{python-dist,helm-chart}"
          merge-multiple: true
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TARGET: ${{ needs.validate.outputs.source_sha }}
        run: |
          python scripts/changelog.py render "${RELEASE_VERSION}" \
            --output release-notes.md
          gh release create "${RELEASE_TAG}" release-assets/* \
            --target "${RELEASE_TARGET}" \
            --title "Jenkins MCP Server ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            $([[ "${RELEASE_VERSION}" == *-* ]] && echo --prerelease || true)
