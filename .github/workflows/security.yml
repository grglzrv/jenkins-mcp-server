name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements/runtime.txt
      - name: Audit locked build dependencies
        run: pip-audit -r requirements/build.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
