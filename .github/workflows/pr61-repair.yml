name: PR 61 one-shot repair

on:
  push:
    branches:
      - dependabot/pip/python-dependencies-9a03efc121

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/pip/python-dependencies-9a03efc121
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare curated release notes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## [Unreleased]')
          end = text.index('\n## [', start + len('## [Unreleased]'))
          body = base64.b64decode('').decode()
          path.write_text(text[:start] + body.rstrip() + '\n' + text[end:], encoding='utf-8')
          PY

      - name: Regenerate dependency locks and release pins
        shell: bash
        run: |
          make lock
          make version VERSION=2.10.6
          make verify-lock
          make verify-version
          git diff --check

      - name: Commit repaired PR branch
        shell: bash
        run: |
          git rm .github/workflows/pr61-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "build(deps): repair dependency refresh and prepare 2.10.6"
          git push origin HEAD:dependabot/pip/python-dependencies-9a03efc121
