name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Version consistency
        run: python scripts/check_version.py
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      - name: Validate raw Kubernetes and Argo CD manifests
        run: python scripts/validate_manifests.py
      - name: Test
        run: pytest --cov --cov-report=term-missing
      - name: Build Python package
        run: python -m build
      - name: Validate Python package metadata
        run: twine check dist/*

  policy:
    name: Guardrail policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: Check policy syntax
        run: opa check docker/policy.rego
      - name: Run guardrail policy tests
        run: opa test docker/ -v

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version consistency
        run: python scripts/check_version.py
      - name: Lint chart
        run: helm lint --strict charts/jenkins-mcp-server
      - name: Render default chart
        run: helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp > /tmp/default.yaml
      - name: Render production example
        run: helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp -f examples/values/tailscale-production.yaml > /tmp/production.yaml
      - name: Render GCP External Secrets example
        run: helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp -f examples/values/external-secrets-gcp-workload-identity.yaml > /tmp/gcp.yaml
      - name: Package chart
        run: helm package charts/jenkins-mcp-server --destination dist

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build local architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jenkins-mcp-server:test
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect image
        run: docker image inspect jenkins-mcp-server:test
