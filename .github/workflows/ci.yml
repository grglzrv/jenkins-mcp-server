name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Version consistency
        run: make verify-version
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      - name: Validate raw Kubernetes and Argo CD manifests
        run: python scripts/validate_manifests.py
      - name: Test
        run: pytest --cov --cov-report=term-missing
      - name: Build Python package
        run: python -m build
      - name: Validate Python package metadata
        run: twine check dist/*.whl dist/*.tar.gz

  version-bump:
    # The chart's image tag follows appVersion, which follows VERSION, and the
    # release workflow triggers on a VERSION change. The checker has an
    # explicit policy for package, image, chart, and deployment inputs so a
    # deployable change cannot merge without a strictly newer release version.
    name: Shipped changes bump VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare against the base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          python scripts/check_release_bump.py "$base"

  policy:
    name: Guardrail policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: Check policy syntax
        run: opa check docker/policy.rego
      - name: Run guardrail policy tests
        run: opa test docker/ -v

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          install "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version consistency
        run: make verify-version
      - name: Lint chart
        run: |
          helm lint --strict charts/jenkins-mcp-server \
            --set jenkins.url=https://jenkins.example.com \
            --set jenkins.credentials.create.jenkinsUserId=ci \
            --set jenkins.credentials.create.jenkinsApiToken=ci-placeholder
      - name: Defaults require jenkins.url
        # The chart makes no assumption about the target Jenkins, so an install
        # with no values must fail with a clear message rather than render.
        run: |
          if helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp > /tmp/nourl.yaml 2>&1; then
            echo "expected the render to fail without jenkins.url"; exit 1
          fi
          grep -q "jenkins.url is required" /tmp/nourl.yaml
      - name: Render default chart
        run: |
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
            --set jenkins.url=https://jenkins.example.com \
            --set jenkins.credentials.create.jenkinsUserId=ci \
            --set jenkins.credentials.create.jenkinsApiToken=ci-placeholder > /tmp/default.yaml
      - name: Render major-version-2 credential compatibility
        run: |
          render_dir=$(mktemp -d)
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
            --set jenkins.url=https://jenkins.example.com \
            --set-string jenkins.credentials.create.jenkinsUserId=ci \
            --set-string jenkins.credentials.create.jenkinsApiToken=ci-placeholder > "$render_dir/current.yaml"
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
            --set jenkins.url=https://jenkins.example.com \
            --set-string jenkins.credentials.create.JENKINS_USERNAME=ci \
            --set-string jenkins.credentials.create.JENKINS_TOKEN=ci-placeholder > "$render_dir/v2.2.yaml"
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
            --set jenkins.url=https://jenkins.example.com \
            --set-string jenkins.credentials.create.username=ci \
            --set-string jenkins.credentials.create.token=ci-placeholder > "$render_dir/v2.1.yaml"
          cmp "$render_dir/current.yaml" "$render_dir/v2.2.yaml"
          cmp "$render_dir/current.yaml" "$render_dir/v2.1.yaml"
          if helm template jenkins-mcp charts/jenkins-mcp-server \
            --set jenkins.url=https://jenkins.example.com \
            --set-string jenkins.credentials.create.jenkinsUserId=ci \
            --set-string jenkins.credentials.create.JENKINS_TOKEN=ci-placeholder; then
            echo "expected mixed current and deprecated credentials to fail"
            exit 1
          fi
      - name: Reject extraEnv credential and policy overrides
        run: |
          for name in \
            JENKINS_TOKEN jenkins_token Jenkins_Token \
            MCP_ALLOW_DESTRUCTIVE mcp_read_only \
            MINIBRIDGE_POLICER_ENFORCE minibridge_mode \
            OTEL_EXPORTER_OTLP_ENDPOINT otel_exporter_otlp_endpoint \
            TOOLS_DENY tools_deny TOOLS_ALLOW METHODS_DENY GUARDRAILS \
            BASIC_AUTH_SECRET basic_auth_secret; do
            if helm template jenkins-mcp charts/jenkins-mcp-server \
              --set jenkins.url=https://jenkins.example.com \
              --set-string jenkins.credentials.create.jenkinsUserId=ci \
              --set-string jenkins.credentials.create.jenkinsApiToken=ci-placeholder \
              --set-string "mcp.extraEnv[0].name=$name" \
              --set-string 'mcp.extraEnv[0].value=override' > /tmp/extra-env.yaml 2>&1; then
              echo "expected reserved extraEnv name $name to fail"
              exit 1
            fi
            grep -q "is managed by the chart" /tmp/extra-env.yaml
          done
          if helm template jenkins-mcp charts/jenkins-mcp-server \
            --set jenkins.url=https://jenkins.example.com \
            --set-string jenkins.credentials.create.jenkinsUserId=ci \
            --set-string jenkins.credentials.create.jenkinsApiToken=ci-placeholder \
            --set-string 'mcp.extraEnv[0].name=HTTP_PROXY' \
            --set-string 'mcp.extraEnv[0].value=http://proxy-a' \
            --set-string 'mcp.extraEnv[1].name=HTTP_PROXY' \
            --set-string 'mcp.extraEnv[1].value=http://proxy-b' > /tmp/extra-env.yaml 2>&1; then
            echo "expected duplicate extraEnv names to fail"
            exit 1
          fi
          grep -q "duplicates another extraEnv entry" /tmp/extra-env.yaml
      - name: Render production example
        run: helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp -f examples/values/tailscale-production.yaml > /tmp/production.yaml
      - name: Render Minibridge Streamable HTTP with a custom endpoint
        run: |
          helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
            --set jenkins.url=https://jenkins.example.com \
            --set jenkins.credentials.create.jenkinsUserId=ci \
            --set jenkins.credentials.create.jenkinsApiToken=ci-placeholder \
            --set minibridge.enabled=true \
            --set minibridge.mode=http \
            --set mcp.path=/custom-mcp > /tmp/minibridge-custom-path.yaml
          grep -A1 -F 'name: MINIBRIDGE_ENDPOINT_MCP' /tmp/minibridge-custom-path.yaml | \
            grep -F 'value: "/custom-mcp"'
          if grep -q -E '^  MCP_(TRANSPORT|HOST|PORT|PATH|HEALTH_HOST|HEALTH_PORT):' \
            /tmp/minibridge-custom-path.yaml; then
            echo "direct-server listener variables leaked into the Minibridge render"
            exit 1
          fi
      - name: Render GCP External Secrets example
        run: helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp -f examples/values/external-secrets-gcp-workload-identity.yaml > /tmp/gcp.yaml
      - name: Render every shipped values example
        run: |
          for f in examples/values/*.yaml; do
            echo "rendering $f"
            helm template jenkins-mcp charts/jenkins-mcp-server --namespace jenkins-mcp \
              -f "$f" --set jenkins.credentials.create.jenkinsApiToken=ci-placeholder > /dev/null
          done
      - name: Strictly validate every rendered chart manifest
        run: ./scripts/validate_helm_renders.sh
      - name: Build the kustomize targets
        run: |
          for d in base overlays/production minibridge; do
            echo "building deploy/kubernetes/$d"
            kubectl kustomize "deploy/kubernetes/$d" > /dev/null
          done
      - name: Package chart
        run: helm package charts/jenkins-mcp-server --destination dist

  chart-smoke:
    # Installs the chart into a real k3s cluster. Kept in a reusable workflow so
    # the release gate runs exactly the same steps.
    needs: helm
    uses: ./.github/workflows/chart-smoke.yml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build local architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jenkins-mcp-server:test
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect image
        run: docker image inspect jenkins-mcp-server:test

      - name: Build the minibridge variant
        # Catches a broken Dockerfile.minibridge on the PR rather than at
        # release time, when the tag is already expected to exist.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.minibridge
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
