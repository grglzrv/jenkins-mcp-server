name: Chart smoke test

# Installs the chart into a real k3s cluster. `helm lint` and `helm template`
# already run in CI and are not repeated here; this covers what only an API
# server can tell you: whether the manifests are accepted, the pod actually
# starts, the probes pass, the NetworkPolicy lets legitimate traffic through,
# and whether an upgrade over an existing release is clean.
#
# Reusable so CI runs it on every change and the release gates on it, without
# the steps existing in two places.
on:
  workflow_call:
    inputs:
      k3s_versions:
        description: "JSON array of k3s versions to test"
        required: false
        default: '["v1.36.2+k3s1","v1.35.6+k3s1","v1.34.9+k3s1","v1.33.13+k3s1"]'
        type: string
      source_ref:
        description: "Commit or ref containing the chart and application to test"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "k3s ${{ matrix.k3s }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        k3s: ${{ fromJSON(inputs.k3s_versions || '["v1.36.2+k3s1","v1.35.6+k3s1","v1.34.9+k3s1","v1.33.13+k3s1"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Start k3s ${{ matrix.k3s }}
        run: |
          # --disable traefik: the chart's ingress is off for this test, and an
          # unused controller only adds startup time.
          sh integration/install_k3s_with_retry.sh '${{ matrix.k3s }}'
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"

      - name: Wait for the node
        run: |
          for _ in $(seq 1 90); do
            kubectl get nodes -o name 2>/dev/null | grep -q . && break
            sleep 2
          done
          kubectl get nodes -o name | grep -q .
          kubectl wait --for=condition=Ready node --all --timeout=180s
          kubectl version
          echo "server: $(kubectl version -o json | python3 -c 'import json,sys;print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"

      - name: Build the image from this commit and import it into k3s
        # Not the published tag: the chart's appVersion is bumped before the
        # image for that version exists, so a fresh main would always pull a
        # missing tag. Building here also means the chart is tested against the
        # code in the commit rather than whatever was last released.
        run: |
          docker build -t jenkins-mcp-server:smoke .
          docker save jenkins-mcp-server:smoke | sudo k3s ctr images import -
          sudo k3s ctr images ls | grep jenkins-mcp-server

      - name: Create the namespace and credentials
        run: |
          kubectl create namespace jenkins-mcp
          # The server needs credentials to start. It never reaches Jenkins in
          # this test: readiness only reports passively observed connectivity.
          kubectl -n jenkins-mcp create secret generic jenkins-mcp-secrets \
            --from-literal=JENKINS_USERNAME=smoke \
            --from-literal=JENKINS_TOKEN=smoke-token

      - name: Install the chart
        run: |
          set +e
          helm install jenkins-mcp charts/jenkins-mcp-server \
            --namespace jenkins-mcp \
            --values .github/smoke-values.yaml \
            --set image.repository=jenkins-mcp-server \
            --set image.tag=smoke \
            --set image.pullPolicy=Never \
            --wait --timeout 5m > /tmp/install.log 2>&1
          code=$?
          set -e
          cat /tmp/install.log
          if [ "$code" -ne 0 ]; then
            echo "::error::helm install failed :: $(tail -c 600 /tmp/install.log | tr '\n' '~')"
          fi
          exit "$code"

      - name: Show what was created
        run: kubectl -n jenkins-mcp get all,networkpolicy,pdb

      - name: Rollout completed
        run: kubectl -n jenkins-mcp rollout status deploy/jenkins-mcp-jenkins-mcp-server --timeout=180s

      - name: Probes are passing
        run: |
          kubectl -n jenkins-mcp wait --for=condition=Available \
            deploy/jenkins-mcp-jenkins-mcp-server --timeout=180s
          ready=$(kubectl -n jenkins-mcp get deploy jenkins-mcp-jenkins-mcp-server \
            -o jsonpath='{.status.readyReplicas}')
          echo "ready replicas: ${ready:-0}"
          [ "${ready:-0}" -ge 1 ]

      - name: Termination drain hook is installed
        run: |
          command=$(kubectl -n jenkins-mcp get deploy jenkins-mcp-jenkins-mcp-server \
            -o jsonpath='{.spec.template.spec.containers[0].lifecycle.preStop.exec.command[0]}{ " " }{.spec.template.spec.containers[0].lifecycle.preStop.exec.command[1]}')
          echo "preStop command: $command"
          [ "$command" = '/usr/bin/sleep 3' ]

      - name: Audit file configuration is live and healthy
        run: |
          for pod in $(kubectl -n jenkins-mcp get pods \
            -l app.kubernetes.io/instance=jenkins-mcp \
            -o name); do
            echo "checking $pod"
            kubectl -n jenkins-mcp exec -i "$pod" -- python - <<'PY'
          import asyncio, hashlib, json, os, stat, urllib.request
          from pathlib import Path
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          assert os.environ["MCP_AUDIT_REQUIRED_FOR_READINESS"] == "true"
          assert os.environ["MCP_AUDIT_MAX_BYTES"] == "65536"
          assert os.environ["MCP_AUDIT_BACKUP_COUNT"] == "2"
          assert os.environ["MCP_HEALTH_MAX_CONNECTIONS"] == "64"
          assert os.environ["MCP_MAX_REQUEST_TARGET_BYTES"] == "8192"
          assert os.environ["MCP_MAX_REQUEST_BYTES"] == "4096"
          assert os.environ["MCP_MAX_RESPONSE_BYTES"] == "10000000"
          assert os.environ["JENKINS_MAX_CONCURRENCY"] == "7"
          path = Path(os.environ["MCP_AUDIT_LOG_PATH"])
          lock = path.with_name(path.name + ".lock")
          assert path.is_file() and lock.is_file()
          assert stat.S_IMODE(path.stat().st_mode) == 0o600
          assert stat.S_IMODE(lock.stat().st_mode) == 0o600
          payload = json.load(urllib.request.urlopen("http://127.0.0.1:8081/readyz"))
          assert payload["status"] == "ready"
          assert payload["checks"]["audit_log_writable"] is True
          assert payload["jenkins"] == {
              "last_contact_age_seconds": None,
              "last_transport_error": None,
          }

          marker = "SMOKE-QUERY-CREDENTIAL-MARKER"

          async def exercise_policy_and_redaction():
              async with streamable_http_client("http://127.0.0.1:8000/mcp") as streams:
                  read_stream, write_stream = streams
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      result = await session.call_tool(
                          "get_job", {"job_name": "Outside/smoke"}
                      )
                      assert result.is_error, "out-of-scope job was not refused"
                      result = await session.call_tool(
                          "get_job", {"job_name": "Outside/" + "Z" * 8192}
                      )
                      assert result.is_error, "oversized denial was not refused"
                      result = await session.call_tool(
                          "jenkins_admin_request",
                          {
                              "method": "POST",
                              "path": "/readyz",
                              "body": "A" * 8192,
                          },
                      )
                      assert result.is_error, result
                      assert "MCP_MAX_REQUEST_BYTES" in str(result), result
                      result = await session.call_tool(
                          "jenkins_admin_request",
                          {
                              "method": "GET",
                              "path": "/readyz?tree=" + "X" * 8192,
                          },
                      )
                      assert result.is_error, result
                      assert "MCP_MAX_REQUEST_TARGET_BYTES" in str(result), result
                      result = await session.call_tool(
                          "jenkins_admin_request",
                          {
                              "method": "GET",
                              "path": f"/readyz?%74oken={marker}&tree=jenkins",
                          },
                      )
                      # The health handler deliberately matches the complete
                      # request target and therefore returns 404 when a query
                      # is attached. Requiring that error plus the audit status
                      # below proves the call reached HTTPX, rather than being
                      # refused before the leak-prone logging path.
                      assert result.is_error, result
                      assert "Jenkins returned 404" in str(result), result

          asyncio.run(exercise_policy_and_redaction())
          audit_text = path.read_text()
          assert marker not in audit_text
          records = [json.loads(line) for line in audit_text.splitlines()]
          denial = next(
              record for record in reversed(records)
              if record.get("action") == "policy.denied"
              and record.get("target") == "Outside/smoke"
          )
          assert denial["check"] == "check_job"
          assert denial["target"] == "Outside/smoke"
          assert denial["job"] == "Outside/smoke"
          assert denial["outcome"] == "denied"
          long_denial = next(
              record for record in reversed(records)
              if record.get("action") == "policy.denied"
              and "sha256=" in record.get("target", "")
          )
          digest = hashlib.sha256(("Outside/" + "Z" * 8192).encode()).hexdigest()
          assert digest in long_denial["target"]
          assert digest in long_denial["job"]
          assert len(json.dumps(long_denial).encode()) <= 16384
          assert all(len(line.encode()) <= 16384 for line in audit_text.splitlines())
          oversized = next(
              record for record in reversed(records)
              if record.get("status") == "request_too_large"
          )
          assert oversized["action"] == "admin.request"
          assert oversized["outcome"] == "failure"
          assert oversized["request_bytes"] == 8192
          assert oversized["request_limit_bytes"] == 4096
          oversized_target = next(
              record for record in reversed(records)
              if record.get("status") == "request_target_too_long"
          )
          assert oversized_target["action"] == "admin.request"
          assert oversized_target["outcome"] == "failure"
          assert oversized_target["target_bytes"] > 8192
          assert oversized_target["target_limit_bytes"] == 8192
          assert oversized_target["path"] == "/readyz?[redacted]"
          admin = next(
              record for record in reversed(records)
              if record.get("action") == "admin.request"
          )
          assert admin["outcome"] == "failure"
          assert admin["status"] == 404
          assert admin["path"] == "/readyz?[redacted]"
          PY
            logs=$(kubectl -n jenkins-mcp logs "$pod" --all-containers=true)
            if grep -Fq 'SMOKE-QUERY-CREDENTIAL-MARKER' <<<"$logs"; then
              echo "::error::$pod leaked the query credential marker to process logs"
              exit 1
            fi
            grep -Fq '/readyz?[redacted]' <<<"$logs"
          done

      - name: Helm test
        # Exercises the chart's own test pod, which reaches the health endpoint
        # through the Service. This is also the check that proves the
        # NetworkPolicy admits legitimate in-cluster traffic.
        run: helm test jenkins-mcp --namespace jenkins-mcp --timeout 3m

      - name: The MCP endpoint answers
        run: |
          kubectl -n jenkins-mcp port-forward svc/jenkins-mcp-jenkins-mcp-server 8000:8000 &
          sleep 5
          # A POST without a session is expected to be rejected by the protocol,
          # not to 404: that distinguishes "mounted and serving" from "absent".
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp || echo 000)
          echo "POST /mcp -> $code"
          case "$code" in 400|406|415) echo "endpoint is serving";; *) echo "unexpected"; exit 1;; esac

      - name: Upgrade over the existing release
        # Catches immutable-field errors and ownership conflicts that a fresh
        # install never surfaces.
        run: |
          helm upgrade jenkins-mcp charts/jenkins-mcp-server \
            --namespace jenkins-mcp \
            --values .github/smoke-values.yaml \
            --set image.repository=jenkins-mcp-server \
            --set image.tag=smoke \
            --set image.pullPolicy=Never \
            --set mcp.allowedJobs='AI/*' \
            --wait --timeout 5m
          helm history jenkins-mcp --namespace jenkins-mcp

      - name: Uninstall cleanly
        run: |
          helm uninstall jenkins-mcp --namespace jenkins-mcp --wait --timeout 3m
          # Check the resources the chart owns, not `get all`: the rolling
          # upgrade leaves a terminated pod behind for a moment, and counting
          # that as a leak fails a perfectly clean uninstall.
          left=""
          for kind in deployment service configmap serviceaccount networkpolicy poddisruptionbudget; do
            found=$(kubectl -n jenkins-mcp get "$kind" \
              -l app.kubernetes.io/instance=jenkins-mcp \
              --no-headers 2>/dev/null | wc -l)
            echo "  $kind remaining: $found"
            [ "$found" -eq 0 ] || left="$left $kind"
          done
          if [ -n "$left" ]; then
            echo "::error::uninstall left resources behind:$left"
            kubectl -n jenkins-mcp get all,networkpolicy,pdb || true
            exit 1
          fi
          echo "uninstall removed every chart-owned resource"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::pods"; kubectl -n jenkins-mcp get pods -o wide || true; echo "::endgroup::"
          echo "::group::describe"; kubectl -n jenkins-mcp describe pods || true; echo "::endgroup::"
          echo "::group::logs"; kubectl -n jenkins-mcp logs -l app.kubernetes.io/name=jenkins-mcp-server --tail=120 --all-containers || true; echo "::endgroup::"
          echo "::group::events"; kubectl -n jenkins-mcp get events --sort-by=.lastTimestamp || true; echo "::endgroup::"
          # Container-level state identifies the failure: an unresolvable
          # image, a crash loop and probes that never pass all look identical
          # from the Deployment's point of view. jsonpath keeps this on one
          # line; a heredoc here would break the YAML block scalar.
          states=$(kubectl -n jenkins-mcp get pods -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{range .status.containerStatuses[*]}{" | "}{.name}{"="}{.state}{end}{"\n"}{end}' 2>/dev/null | tr '\n' '~' | cut -c1-700)
          echo "::error::k3s ${{ matrix.k3s }} smoke failed :: ${states:-no pods}"

  credential-sources:
    # Proves the ownership and runtime contracts for all production credential
    # modes. ESO uses its Kubernetes provider against an isolated source
    # namespace, so this is a real reconciliation/rotation test rather than a
    # CRD render check.
    name: "credential sources (Helm, existing, ESO)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pin ESO independently from this repository's application version.
      ESO_CHART_VERSION: 2.8.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Start k3s
        run: |
          sh integration/install_k3s_with_retry.sh 'v1.36.2+k3s1'
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
          for _ in $(seq 1 90); do
            kubectl get nodes -o name 2>/dev/null | grep -q . && break
            sleep 2
          done
          kubectl get nodes -o name | grep -q .
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Build and import the application image
        run: |
          docker build -t jenkins-mcp-server:credentials-smoke .
          docker save jenkins-mcp-server:credentials-smoke | sudo k3s ctr images import -

      - name: Helm-managed Secret is owned, rotated, and deleted
        run: |
          kubectl create namespace credentials-managed
          helm install managed charts/jenkins-mcp-server \
            --namespace credentials-managed \
            --set jenkins.url=https://jenkins.smoke.invalid \
            --set jenkins.credentials.create.jenkinsUserId=managed-user \
            --set jenkins.credentials.create.jenkinsApiToken=managed-v1 \
            --set image.repository=jenkins-mcp-server \
            --set image.tag=credentials-smoke \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false \
            --wait --timeout 5m
          secret=managed-jenkins-mcp-server-credentials
          deployment=managed-jenkins-mcp-server
          [ "$(kubectl -n credentials-managed get secret "$secret" -o jsonpath='{.data.JENKINS_TOKEN}' | base64 -d)" = managed-v1 ]
          old_pod=$(kubectl -n credentials-managed get pod -l app.kubernetes.io/instance=managed -o jsonpath='{.items[0].metadata.name}')
          helm upgrade managed charts/jenkins-mcp-server \
            --namespace credentials-managed --reuse-values \
            --set jenkins.credentials.create.jenkinsApiToken=managed-v2 \
            --wait --timeout 5m
          kubectl -n credentials-managed rollout status deployment/$deployment --timeout=180s
          kubectl -n credentials-managed wait --for=delete pod/$old_pod --timeout=120s
          new_pod=$(kubectl -n credentials-managed get pod -l app.kubernetes.io/instance=managed -o jsonpath='{.items[0].metadata.name}')
          [ "$old_pod" != "$new_pod" ]
          [ "$(kubectl -n credentials-managed exec deployment/$deployment -- python -c 'import os; print(os.environ["JENKINS_TOKEN"])')" = managed-v2 ]
          helm uninstall managed --namespace credentials-managed --wait
          kubectl -n credentials-managed wait --for=delete secret/$secret --timeout=60s

      - name: Existing Secret rotates after restart and is never owned or deleted
        run: |
          kubectl create namespace credentials-existing
          kubectl -n credentials-existing create secret generic supplied-credentials \
            --from-literal=custom-user=existing-user \
            --from-literal=custom-token=existing-token
          helm install existing charts/jenkins-mcp-server \
            --namespace credentials-existing \
            --set jenkins.url=https://jenkins.smoke.invalid \
            --set jenkins.credentials.create.enabled=false \
            --set jenkins.credentials.existingSecret.enabled=true \
            --set jenkins.credentials.existingSecret.name=supplied-credentials \
            --set jenkins.credentials.existingSecret.usernameKey=custom-user \
            --set jenkins.credentials.existingSecret.tokenKey=custom-token \
            --set image.repository=jenkins-mcp-server \
            --set image.tag=credentials-smoke \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false \
            --wait --timeout 5m
          [ "$(kubectl -n credentials-existing exec deployment/existing-jenkins-mcp-server -- python -c 'import os; print(os.environ["JENKINS_TOKEN"])')" = existing-token ]
          kubectl -n credentials-existing create secret generic supplied-credentials \
            --from-literal=custom-user=existing-user \
            --from-literal=custom-token=existing-token-v2 \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n credentials-existing rollout restart deployment/existing-jenkins-mcp-server
          kubectl -n credentials-existing rollout status deployment/existing-jenkins-mcp-server --timeout=180s
          [ "$(kubectl -n credentials-existing exec deployment/existing-jenkins-mcp-server -- python -c 'import os; print(os.environ["JENKINS_TOKEN"])')" = existing-token-v2 ]
          helm uninstall existing --namespace credentials-existing --wait
          kubectl -n credentials-existing get secret supplied-credentials

      - name: Split Secret refs are read independently and never owned
        run: |
          kubectl create namespace credentials-split
          kubectl -n credentials-split create secret generic supplied-user \
            --from-literal=login-id=split-user
          kubectl -n credentials-split create secret generic supplied-token \
            --from-literal=api-token=split-token
          helm install split charts/jenkins-mcp-server \
            --namespace credentials-split \
            --set jenkins.url=https://jenkins.smoke.invalid \
            --set jenkins.credentials.create.enabled=false \
            --set jenkins.credentials.secretKeyRefs.enabled=true \
            --set jenkins.credentials.secretKeyRefs.username.name=supplied-user \
            --set jenkins.credentials.secretKeyRefs.username.key=login-id \
            --set jenkins.credentials.secretKeyRefs.token.name=supplied-token \
            --set jenkins.credentials.secretKeyRefs.token.key=api-token \
            --set image.repository=jenkins-mcp-server \
            --set image.tag=credentials-smoke \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false \
            --wait --timeout 5m
          deployment=split-jenkins-mcp-server
          [ "$(kubectl -n credentials-split exec deployment/$deployment -- python -c 'import os; print(os.environ["JENKINS_USERNAME"])')" = split-user ]
          [ "$(kubectl -n credentials-split exec deployment/$deployment -- python -c 'import os; print(os.environ["JENKINS_TOKEN"])')" = split-token ]
          helm uninstall split --namespace credentials-split --wait
          kubectl -n credentials-split get secret supplied-user
          kubectl -n credentials-split get secret supplied-token

      - name: Install pinned External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update external-secrets
          helm install external-secrets external-secrets/external-secrets \
            --namespace external-secrets --create-namespace \
            --version "$ESO_CHART_VERSION" \
            --set installCRDs=true \
            --wait --timeout 6m

      - name: ESO Kubernetes provider syncs and rotates credentials
        run: |
          kubectl create namespace credentials-source
          kubectl create namespace credentials-eso
          kubectl -n credentials-source create secret generic jenkins-source \
            --from-literal=username=eso-user \
            --from-literal=token=eso-v1
          kubectl -n credentials-eso create serviceaccount eso-kubernetes-reader
          kubectl apply -f - <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: eso-kubernetes-reader
            namespace: credentials-source
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["authorization.k8s.io"]
              resources: ["selfsubjectrulesreviews"]
              verbs: ["create"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: eso-kubernetes-reader
            namespace: credentials-source
          subjects:
            - kind: ServiceAccount
              name: eso-kubernetes-reader
              namespace: credentials-eso
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: eso-kubernetes-reader
          EOF
          helm install eso charts/jenkins-mcp-server \
            --namespace credentials-eso \
            --set jenkins.url=https://jenkins.smoke.invalid \
            --set jenkins.credentials.create.enabled=false \
            --set jenkins.credentials.externalSecret.enabled=true \
            --set jenkins.credentials.externalSecret.refreshInterval=5s \
            --set jenkins.credentials.externalSecret.targetUsernameKey=JENKINS_USERNAME \
            --set jenkins.credentials.externalSecret.targetTokenKey=JENKINS_TOKEN \
            --set jenkins.credentials.externalSecret.secretStoreRef.name=kubernetes-store \
            --set jenkins.credentials.externalSecret.secretStoreRef.kind=SecretStore \
            --set jenkins.credentials.externalSecret.secretStore.create=true \
            --set jenkins.credentials.externalSecret.secretStore.kind=SecretStore \
            --set jenkins.credentials.externalSecret.secretStore.provider.kubernetes.remoteNamespace=credentials-source \
            --set jenkins.credentials.externalSecret.secretStore.provider.kubernetes.server.caProvider.type=ConfigMap \
            --set jenkins.credentials.externalSecret.secretStore.provider.kubernetes.server.caProvider.name=kube-root-ca.crt \
            --set jenkins.credentials.externalSecret.secretStore.provider.kubernetes.server.caProvider.key=ca.crt \
            --set jenkins.credentials.externalSecret.secretStore.provider.kubernetes.auth.serviceAccount.name=eso-kubernetes-reader \
            --set jenkins.credentials.externalSecret.usernameRemoteKey=jenkins-source \
            --set jenkins.credentials.externalSecret.usernameRemoteProperty=username \
            --set jenkins.credentials.externalSecret.tokenRemoteKey=jenkins-source \
            --set jenkins.credentials.externalSecret.tokenRemoteProperty=token \
            --set image.repository=jenkins-mcp-server \
            --set image.tag=credentials-smoke \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false
          kubectl -n credentials-eso wait --for=condition=Ready \
            externalsecret/eso-jenkins-mcp-server --timeout=180s
          kubectl -n credentials-eso rollout status deployment/eso-jenkins-mcp-server --timeout=180s
          target=eso-jenkins-mcp-server-credentials
          [ "$(kubectl -n credentials-eso get secret "$target" -o jsonpath='{.data.JENKINS_TOKEN}' | base64 -d)" = eso-v1 ]
          kubectl -n credentials-source create secret generic jenkins-source \
            --from-literal=username=eso-user \
            --from-literal=token=eso-v2 \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n credentials-eso annotate externalsecret eso-jenkins-mcp-server \
            force-sync="$(date +%s)" --overwrite
          for _ in $(seq 1 90); do
            token=$(kubectl -n credentials-eso get secret "$target" -o jsonpath='{.data.JENKINS_TOKEN}' 2>/dev/null | base64 -d || true)
            [ "$token" = eso-v2 ] && break
            sleep 2
          done
          [ "${token:-}" = eso-v2 ]
          kubectl -n credentials-eso rollout restart deployment/eso-jenkins-mcp-server
          kubectl -n credentials-eso rollout status deployment/eso-jenkins-mcp-server --timeout=180s
          [ "$(kubectl -n credentials-eso exec deployment/eso-jenkins-mcp-server -- python -c 'import os; print(os.environ["JENKINS_TOKEN"])')" = eso-v2 ]

      - name: Credential diagnostics on failure
        if: failure()
        run: |
          kubectl get externalsecrets,secretstores -A || true
          kubectl get pods -A -o wide || true
          kubectl -n external-secrets logs deployment/external-secrets --tail=150 || true
          for namespace in credentials-managed credentials-existing credentials-split credentials-eso; do
            kubectl -n "$namespace" describe pods 2>/dev/null || true
          done

  minibridge:
    # A running proxy proves nothing about the policy in front of it. This
    # installs the minibridge variant and speaks MCP through it, asserting that
    # denied tools are hidden and refused, allowed tools are not, and a
    # guardrail pattern in arguments is blocked.
    name: "minibridge on k3s ${{ matrix.k3s }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        k3s: ${{ fromJSON(inputs.k3s_versions || '["v1.36.2+k3s1"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install 'mcp>=2.0.0,<3'

      - name: Start k3s ${{ matrix.k3s }}
        run: |
          sh integration/install_k3s_with_retry.sh '${{ matrix.k3s }}'
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"

      - name: Wait for the node
        run: |
          for _ in $(seq 1 90); do
            kubectl get nodes -o name 2>/dev/null | grep -q . && break
            sleep 2
          done
          kubectl get nodes -o name | grep -q .
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Build the minibridge image and import it
        run: |
          set +e
          docker build -f docker/Dockerfile.minibridge -t jenkins-mcp-server:smoke-mb . > /tmp/build.log 2>&1
          code=$?
          set -e
          tail -n 60 /tmp/build.log
          if [ "$code" -ne 0 ]; then
            echo "::error::minibridge image build failed :: $(tail -c 900 /tmp/build.log | tr '\n' '~' | tr -s ' ')"
            exit 1
          fi
          docker save jenkins-mcp-server:smoke-mb | sudo k3s ctr images import -

      - name: Namespace and credentials
        run: |
          kubectl create namespace jenkins-mcp
          kubectl -n jenkins-mcp create secret generic jenkins-mcp-secrets \
            --from-literal=JENKINS_USERNAME=smoke \
            --from-literal=JENKINS_TOKEN=smoke-token

      - name: Install with minibridge enforcing
        run: |
          set +e
          helm install jenkins-mcp charts/jenkins-mcp-server \
            --namespace jenkins-mcp \
            --values .github/smoke-values-minibridge.yaml \
            --set image.repository=jenkins-mcp-server \
            --set minibridge.image.repository=jenkins-mcp-server \
            --set minibridge.image.tag=smoke-mb \
            --set image.pullPolicy=Never \
            --wait --timeout 5m > /tmp/install.log 2>&1
          code=$?
          set -e
          cat /tmp/install.log
          [ "$code" -eq 0 ] || { echo "::error::minibridge install failed :: $(tail -c 500 /tmp/install.log | tr '\n' '~')"; exit 1; }

      - name: Prove the policy is enforced
        run: |
          kubectl -n jenkins-mcp port-forward svc/jenkins-mcp-jenkins-mcp-server 8000:8000 &
          sleep 6
          set +e
          python integration/minibridge_probe.py http://127.0.0.1:8000/mcp > /tmp/probe.log 2>&1
          code=$?
          set -e
          cat /tmp/probe.log
          [ "$code" -eq 0 ] || { echo "::error::minibridge policy not enforced :: $(tail -c 600 /tmp/probe.log | tr '\n' '~')"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::pods"; kubectl -n jenkins-mcp get pods -o wide || true; echo "::endgroup::"
          echo "::group::logs"; kubectl -n jenkins-mcp logs -l app.kubernetes.io/name=jenkins-mcp-server --tail=150 --all-containers || true; echo "::endgroup::"
          # The container's own output is what explains a crash loop; pod
          # state only says that it restarted. Annotations are readable from
          # the API, the job log is not.
          logs=$(kubectl -n jenkins-mcp logs -l app.kubernetes.io/name=jenkins-mcp-server \
                   --tail=40 --all-containers --previous 2>/dev/null \
                 || kubectl -n jenkins-mcp logs -l app.kubernetes.io/name=jenkins-mcp-server \
                      --tail=40 --all-containers 2>/dev/null)
          logs=$(printf '%s' "$logs" | tr '\n' '~' | tr -s ' ' | tail -c 1200)
          echo "::error::minibridge smoke failed on ${{ matrix.k3s }} :: ${logs:-no container output}"

  minibridge-all-tools:
    # Deploys a real disposable Jenkins and proves the effective policy, not
    # merely that Minibridge starts. The server-side policy permits everything;
    # Minibridge alone hides/refuses @destructive while all other tools must
    # complete against Jenkins.
    name: "minibridge all-tools Jenkins smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install 'mcp>=2.0.0,<3'

      - name: Start k3s v1.36.2+k3s1
        run: |
          sh integration/install_k3s_with_retry.sh 'v1.36.2+k3s1'
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          for _ in $(seq 1 90); do
            kubectl get nodes -o name 2>/dev/null | grep -q . && break
            sleep 2
          done
          kubectl get nodes -o name | grep -q .
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Build Jenkins and Minibridge images
        run: |
          docker build -f integration/jenkins/Dockerfile \
            -t jenkins-smoke:ci integration/jenkins
          docker build -f docker/Dockerfile.minibridge \
            -t jenkins-mcp-server:smoke-mb .
          docker save jenkins-smoke:ci jenkins-mcp-server:smoke-mb | \
            sudo k3s ctr images import -

      - name: Deploy Jenkins
        run: |
          kubectl create namespace jenkins-mcp
          kubectl -n jenkins-mcp apply -f integration/jenkins/kubernetes-smoke.yaml
          kubectl -n jenkins-mcp rollout status deployment/jenkins-smoke --timeout=6m
          kubectl -n jenkins-mcp wait --for=condition=Ready \
            pod -l app.kubernetes.io/name=jenkins-smoke --timeout=2m

      - name: Install Helm chart with only destructive tools denied
        run: |
          kubectl -n jenkins-mcp create secret generic jenkins-mcp-secrets \
            --from-literal=JENKINS_USERNAME=admin \
            --from-literal=JENKINS_TOKEN=admin-test-password
          helm install jenkins-mcp charts/jenkins-mcp-server \
            --namespace jenkins-mcp \
            --values .github/smoke-values-minibridge-tools.yaml \
            --set image.repository=jenkins-mcp-server \
            --set minibridge.image.repository=jenkins-mcp-server \
            --set minibridge.image.tag=smoke-mb \
            --set image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Exercise every non-destructive tool through Minibridge
        run: |
          kubectl -n jenkins-mcp port-forward \
            svc/jenkins-mcp-jenkins-mcp-server 8000:8000 &
          sleep 5
          python integration/minibridge_all_tools.py http://127.0.0.1:8000/mcp

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::pods"; kubectl -n jenkins-mcp get pods -o wide || true; echo "::endgroup::"
          echo "::group::jenkins"; kubectl -n jenkins-mcp logs deployment/jenkins-smoke --tail=200 || true; echo "::endgroup::"
          echo "::group::minibridge"; kubectl -n jenkins-mcp logs deployment/jenkins-mcp-jenkins-mcp-server --tail=200 || true; echo "::endgroup::"
