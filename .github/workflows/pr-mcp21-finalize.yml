name: Finalize MCP 2.1 hardening

on:
  push:
    branches:
      - dependabot/pip/python-dependencies-d6ef873569

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/pip/python-dependencies-d6ef873569
          fetch-depth: 0

      - name: Harden template validation at the MCP boundary
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_template_boundary.py
          python /tmp/patch_template_boundary.py

      - name: Format and validate template boundary regressions
        run: |
          python -m pip install --disable-pip-version-check -e . pytest pytest-asyncio ruff
          ruff format src/jenkins_mcp_server/server.py tests/test_server_error_contract.py
          ruff check src tests/test_server_error_contract.py
          pytest -q tests/test_server_error_contract.py tests/test_templates.py tests/test_server_lifecycle.py
          python -m compileall -q src
          git diff --check

      - name: Commit product changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jenkins_mcp_server/server.py tests/test_server_error_contract.py CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: classify template validation as expected MCP errors'
          git push origin HEAD:dependabot/pip/python-dependencies-d6ef873569
