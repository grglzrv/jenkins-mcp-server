name: Finalize MCP 2.1 hardening

on:
  push:
    branches:
      - dependabot/pip/python-dependencies-d6ef873569

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/pip/python-dependencies-d6ef873569
          fetch-depth: 0

      - name: Reuse reviewed hardening patch
        run: |
          payload=$(sed -n "s/.*printf '%s' '\([^']*\)'.*/\1/p" .github/workflows/pr-mcp21-smoke-fix.yml | head -n 1)
          test -n "$payload"
          printf '%s' "$payload" | base64 --decode > /tmp/patch_mcp21.py
          python /tmp/patch_mcp21.py

      - name: Preserve bounded transport diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/jenkins_mcp_server/client.py")
          text = path.read_text(encoding="utf-8")
          old = '''        # Transport exceptions can contain URLs, proxy details and caller
        # query strings. The audit record above stores only the exception type;
        # keep the MCP-facing message deliberately static.
        raise JenkinsError("Jenkins request failed due to a transport error")'''
          new = '''        # Preserve only diagnostics generated by this process or a bounded,
        # redacted request target. Never surface the transport exception text:
        # HTTPX/proxy errors can contain origins, credentials, and full queries.
        if (
            isinstance(last_error, httpx.PoolTimeout)
            and str(last_error) == "Timed out waiting for a Jenkins concurrency slot"
        ):
            message = "Timed out waiting for a Jenkins concurrency slot"
        else:
            failed_request = getattr(last_error, "request", None)
            if failed_request is not None:
                safe_target = failed_request.url.path
                if failed_request.url.query:
                    safe_target += "?[redacted]"
                message = f"Jenkins request failed for {safe_target}"
            else:
                message = "Jenkins request failed due to a transport error"
        raise JenkinsError(message) from last_error'''
          if text.count(old) != 1:
              raise SystemExit("expected one generic transport-error block")
          path.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/test_mcp_error_contract.py")
          text = test.read_text(encoding="utf-8")
          replacements = [
              ("MCP_MAX_REQUEST_BYTES=64", "MCP_MAX_REQUEST_BYTES=1024"),
              ('"A" * 128', '"A" * 2048'),
              (
                  'assert message == "Jenkins request failed due to a transport error"',
                  'assert message == "Jenkins request failed for /readyz?[redacted]"',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one regression-test fragment: {old!r}")
              text = text.replace(old, new)
          test.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate focused regressions
        run: |
          python -m pip install --disable-pip-version-check -e . pytest pytest-asyncio ruff
          ruff format src/jenkins_mcp_server/client.py src/jenkins_mcp_server/security.py tests/test_mcp_error_contract.py
          ruff check src tests/test_mcp_error_contract.py
          pytest -q tests/test_mcp_error_contract.py tests/test_client_hardening.py
          python -m compileall -q src
          git diff --check

      - name: Commit product changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/jenkins_mcp_server/client.py src/jenkins_mcp_server/security.py tests/test_mcp_error_contract.py CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: align expected failures with MCP 2.1 error handling'
          git push origin HEAD:dependabot/pip/python-dependencies-d6ef873569
