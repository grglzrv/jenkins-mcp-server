services:
  jenkins:
    build:
      context: ./integration/jenkins
      # Dockerfile.legacy resolves plugins from the core's own update centre
      # line. The default suite keeps the standard Dockerfile untouched.
      dockerfile: ${JENKINS_DOCKERFILE:-Dockerfile}
      args:
        # Overridden by the compatibility matrix to test other Jenkins cores.
        JENKINS_IMAGE: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk21}
        JENKINS_UC_LINE: ${JENKINS_UC_LINE:-}
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc/jenkins.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports: ["8443:8443"]
    volumes:
      - jenkins-home:/var/jenkins_home
  mcp:
    build: .
    depends_on: [jenkins]
    environment:
      JENKINS_URL: https://jenkins:8443
      JENKINS_USERNAME: admin
      JENKINS_TOKEN: ${JENKINS_TOKEN}
      JENKINS_CA_BUNDLE: /certs/ca.crt
      MCP_TRANSPORT: streamable-http
      MCP_PATH: /mcp
      MCP_ALLOW_ADMIN_REQUEST: "false"
      MCP_ALLOW_SCRIPT_CONSOLE: "false"
      # This suite deliberately exercises stop_build and delete_job, which are
      # gated off by default. The master switch and both per-action gates must
      # be explicit; production defaults remain fail-closed.
      MCP_ALLOW_DESTRUCTIVE: "true"
      MCP_ALLOW_JOB_DELETE: "true"
      MCP_ALLOW_BUILD_STOP: "true"
    ports: ["8000:8000", "8081:8081"]
    volumes:
      - jenkins-home:/jenkins-home:ro
      - ./integration/shared-certs:/certs:ro
volumes:
  jenkins-home:
