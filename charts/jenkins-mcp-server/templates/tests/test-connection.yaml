{{- if .Values.service.exposeHealthPort }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "jenkins-mcp-server.fullname" . }}-test-connection"
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      # A Deployment can report Available just before the Service endpoints are
      # visible to a newly scheduled pod. Retry that short propagation window
      # rather than turning one early connection refusal into a flaky release.
      command: ["sh", "-ec"]
      args:
        - |
          # Helpers, not the raw values: minibridge moves the health port and
          # serves "/" rather than /readyz.
          url="http://{{ include "jenkins-mcp-server.fullname" . }}:{{ include "jenkins-mcp-server.healthPort" . }}{{ include "jenkins-mcp-server.readyPath" . }}"
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if wget --spider --timeout=3 --tries=1 "$url"; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "health endpoint did not become reachable after $attempt attempts" >&2
              exit 1
            fi
            echo "health endpoint not ready (attempt $attempt/30); retrying in 2s" >&2
            attempt=$((attempt + 1))
            sleep 2
          done
{{- end }}
