{{- if .Values.tailscale.egress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.tailscale.egress.serviceName }}
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
  annotations:
    tailscale.com/tailnet-fqdn: {{ required "tailscale.egress.tailnetFQDN is required" .Values.tailscale.egress.tailnetFQDN | quote }}
    {{- with .Values.tailscale.egress.proxyGroup }}
    tailscale.com/proxy-group: {{ . | quote }}
    {{- end }}
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: {{ .Values.tailscale.egress.port }}
      protocol: TCP
{{- end }}
