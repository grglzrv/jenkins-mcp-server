{{- if and .Values.tailscale.enabled .Values.tailscale.proxyGroups.create }}
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: {{ .Values.tailscale.proxyGroups.ingress.name | quote }}
spec:
  type: ingress
  replicas: {{ .Values.tailscale.proxyGroups.ingress.replicas }}
  hostnamePrefix: {{ .Values.tailscale.proxyGroups.ingress.hostnamePrefix | quote }}
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: {{ .Values.tailscale.proxyGroups.egress.name | quote }}
spec:
  type: egress
  replicas: {{ .Values.tailscale.proxyGroups.egress.replicas }}
  hostnamePrefix: {{ .Values.tailscale.proxyGroups.egress.hostnamePrefix | quote }}
{{- end }}
