{{- include "jenkins-mcp-server.validate" . }}
{{- if .Values.jenkins.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}-credentials
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.jenkins.credentials.usernameKey }}: {{ required "jenkins.credentials.username is required when create=true" .Values.jenkins.credentials.username | quote }}
  {{ .Values.jenkins.credentials.tokenKey }}: {{ required "jenkins.credentials.token is required when create=true" .Values.jenkins.credentials.token | quote }}
{{- end }}
