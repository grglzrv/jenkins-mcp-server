{{- include "jenkins-mcp-server.validate" . }}
{{- if .Values.jenkins.credentials.create.enabled }}
{{- $usernameKey := default "JENKINS_USERNAME" .Values.jenkins.credentials.create.usernameKey }}
{{- $tokenKey := default "JENKINS_TOKEN" .Values.jenkins.credentials.create.tokenKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}-credentials
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $usernameKey }}: {{ required "jenkins.credentials.create.username is required" .Values.jenkins.credentials.create.username | quote }}
  {{ $tokenKey }}: {{ required "jenkins.credentials.create.token is required" .Values.jenkins.credentials.create.token | quote }}
{{- end }}
