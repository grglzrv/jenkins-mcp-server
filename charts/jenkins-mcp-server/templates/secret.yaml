{{- include "jenkins-mcp-server.validate" . }}
{{- if .Values.jenkins.credentials.create.enabled }}
{{- $create := .Values.jenkins.credentials.create }}
{{- $userId := default "" $create.jenkinsUserId }}
{{- $apiToken := default "" $create.jenkinsApiToken }}
{{- $newValues := or (ne $userId "") (ne $apiToken "") }}
{{- $uppercaseUserId := default "" (index $create "JENKINS_USERNAME") }}
{{- $uppercaseApiToken := default "" (index $create "JENKINS_TOKEN") }}
{{- $uppercaseValues := or (ne $uppercaseUserId "") (ne $uppercaseApiToken "") }}
{{- $fixedKeys := or $newValues $uppercaseValues }}
{{- $usernameKey := ternary "JENKINS_USERNAME" (default "JENKINS_USERNAME" $create.usernameKey) $fixedKeys }}
{{- $tokenKey := ternary "JENKINS_TOKEN" (default "JENKINS_TOKEN" $create.tokenKey) $fixedKeys }}
{{- $legacyUserId := default "" $create.username }}
{{- $legacyApiToken := default "" $create.token }}
{{- $resolvedUserId := ternary $userId (ternary $uppercaseUserId $legacyUserId $uppercaseValues) $newValues }}
{{- $resolvedApiToken := ternary $apiToken (ternary $uppercaseApiToken $legacyApiToken $uppercaseValues) $newValues }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}-credentials
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $usernameKey }}: {{ $resolvedUserId | quote }}
  {{ $tokenKey }}: {{ $resolvedApiToken | quote }}
{{- end }}
