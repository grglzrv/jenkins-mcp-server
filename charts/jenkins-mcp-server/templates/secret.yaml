{{- include "jenkins-mcp-server.validate" . }}
{{- if .Values.jenkins.credentials.create.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}-credentials
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.jenkins.credentials.existingSecret.usernameKey }}: {{ required "jenkins.credentials.create.username is required" .Values.jenkins.credentials.create.username | quote }}
  {{ .Values.jenkins.credentials.existingSecret.tokenKey }}: {{ required "jenkins.credentials.create.token is required" .Values.jenkins.credentials.create.token | quote }}
{{- end }}
