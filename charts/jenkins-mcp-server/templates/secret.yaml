{{- include "jenkins-mcp-server.validate" . }}
{{- if .Values.jenkins.credentials.create.enabled }}
{{- $create := .Values.jenkins.credentials.create }}
{{- $canonicalUsername := default "" (index $create "JENKINS_USERNAME") }}
{{- $canonicalToken := default "" (index $create "JENKINS_TOKEN") }}
{{- $canonical := or (ne $canonicalUsername "") (ne $canonicalToken "") }}
{{- $usernameKey := ternary "JENKINS_USERNAME" (default "JENKINS_USERNAME" $create.usernameKey) $canonical }}
{{- $tokenKey := ternary "JENKINS_TOKEN" (default "JENKINS_TOKEN" $create.tokenKey) $canonical }}
{{- $username := ternary $canonicalUsername (default "" $create.username) $canonical }}
{{- $token := ternary $canonicalToken (default "" $create.token) $canonical }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}-credentials
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $usernameKey }}: {{ $username | quote }}
  {{ $tokenKey }}: {{ $token | quote }}
{{- end }}
