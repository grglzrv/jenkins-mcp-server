apiVersion: v1
kind: Service
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . | quote }}
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | quote }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ .sessionAffinity | quote }}
  {{- if eq .sessionAffinity "ClientIP" }}
  {{- with .sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "jenkins-mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
      protocol: TCP
    {{- if .Values.service.exposeHealthPort }}
    - name: health
      port: {{ include "jenkins-mcp-server.healthPort" . }}
      targetPort: health
      protocol: TCP
    {{- end }}
