apiVersion: v1
kind: Service
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "jenkins-mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
      protocol: TCP
    - name: health
      port: {{ .Values.mcp.healthPort }}
      targetPort: health
      protocol: TCP
