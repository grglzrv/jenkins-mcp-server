{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . | quote }}
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jenkins-mcp-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: helm-test
      ports:
        - protocol: TCP
          port: {{ include "jenkins-mcp-server.healthPort" . }}
    {{- if .Values.networkPolicy.allowSameNamespace }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ include "jenkins-mcp-server.mcpPort" . }}
    {{- end }}
    {{- with .Values.networkPolicy.allowedNamespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "jenkins-mcp-server.mcpPort" $ }}
    {{- end }}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if and .Values.tailscale.enabled .Values.tailscale.egress.enabled }}
    # A Tailscale ProxyGroup maps service ports to dynamic proxy ports, so
    # egress to its namespace cannot be filtered by destination port.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.tailscale.namespace | quote }}
    {{- end }}
    {{- if .Values.networkPolicy.allowInternetEgress }}
    - {}
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
