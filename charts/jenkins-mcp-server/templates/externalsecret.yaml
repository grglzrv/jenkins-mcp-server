{{- include "jenkins-mcp-server.validate" . }}
{{- if .Values.jenkins.credentials.externalSecret.enabled }}
{{- if .Values.externalSecret.secretStore.create }}
{{- if not .Values.externalSecret.secretStore.provider }}
{{- fail "externalSecret.secretStore.create is true but externalSecret.secretStore.provider is empty. Set a provider block (gcpsm, vault, aws, azurekv, ...), otherwise the rendered SecretStore is invalid." }}
{{- end }}
{{- if ne .Values.externalSecret.secretStore.kind .Values.externalSecret.secretStoreRef.kind }}
{{- fail (printf "externalSecret.secretStore.kind (%s) must match externalSecret.secretStoreRef.kind (%s) when creating the store, otherwise the ExternalSecret references a store that does not exist." .Values.externalSecret.secretStore.kind .Values.externalSecret.secretStoreRef.kind) }}
{{- end }}
{{- if eq .Values.externalSecret.secretStore.kind "ClusterSecretStore" }}
{{- $gcpsm := dig "gcpsm" dict .Values.externalSecret.secretStore.provider }}
{{- if $gcpsm }}
{{- $wi := dig "auth" "workloadIdentity" dict $gcpsm }}
{{- if and $wi (not (dig "serviceAccountRef" "namespace" "" $wi)) }}
{{- fail "A ClusterSecretStore using gcpsm workloadIdentity must set provider.gcpsm.auth.workloadIdentity.serviceAccountRef.namespace. Cluster-scoped stores have no namespace of their own, so External Secrets cannot resolve the service account without it." }}
{{- end }}
{{- $sr := dig "auth" "secretRef" dict $gcpsm }}
{{- if and $sr (not (dig "secretAccessKeySecretRef" "namespace" "" $sr)) }}
{{- fail "A ClusterSecretStore using a gcpsm service-account key must set provider.gcpsm.auth.secretRef.secretAccessKeySecretRef.namespace, since cluster-scoped stores cannot infer the secret's namespace." }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: {{ .Values.externalSecret.secretStore.kind }}
metadata:
  name: {{ .Values.externalSecret.secretStoreRef.name }}
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
  {{- with .Values.externalSecret.secretStore.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider:
    {{- toYaml (required "externalSecret.secretStore.provider is required when secretStore.create is true" .Values.externalSecret.secretStore.provider) | nindent 4 }}
  {{- with .Values.externalSecret.secretStore.conditions }}
  conditions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "jenkins-mcp-server.fullname" . }}
  labels:
    {{- include "jenkins-mcp-server.labels" . | nindent 4 }}
  {{- with .Values.externalSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "jenkins-mcp-server.fullname" . }}-credentials
    creationPolicy: {{ .Values.externalSecret.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.deletionPolicy }}
    {{- with .Values.externalSecret.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecret.dataFrom | nindent 4 }}
  {{- else }}
  data:
    - secretKey: {{ .Values.jenkins.credentials.existingSecret.usernameKey }}
      remoteRef:
        key: {{ .Values.externalSecret.usernameRemoteKey }}
        {{- with .Values.externalSecret.usernameRemoteProperty }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .Values.externalSecret.remoteVersion }}
        version: {{ . | quote }}
        {{- end }}
    - secretKey: {{ .Values.jenkins.credentials.existingSecret.tokenKey }}
      remoteRef:
        key: {{ .Values.externalSecret.tokenRemoteKey }}
        {{- with .Values.externalSecret.tokenRemoteProperty }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .Values.externalSecret.remoteVersion }}
        version: {{ . | quote }}
        {{- end }}
    {{- with .Values.externalSecret.extraData }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
