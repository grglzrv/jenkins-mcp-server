[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jenkins-mcp-server"
version = "1.24.0"
description = "Production-ready Jenkins MCP server with Streamable HTTP and stdio transports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Georgi Lazarov"}]
maintainers = [{name = "Georgi Lazarov"}]
keywords = ["jenkins", "mcp", "model-context-protocol", "hermes-agent", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.28.1,<1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "uvicorn>=0.52.0,<1",
]

[project.urls]
Homepage = "https://github.com/grglzrv/jenkins-mcp-server"
Repository = "https://github.com/grglzrv/jenkins-mcp-server"
Issues = "https://github.com/grglzrv/jenkins-mcp-server/issues"
Changelog = "https://github.com/grglzrv/jenkins-mcp-server/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
  "mypy>=2.3.0",
  "build>=1.5.0",
  "twine>=7.0.0",
  "PyYAML>=6.0.3",
  # Used directly by tests/test_manifests.py. It currently arrives transitively
  # via mcp, but relying on that would break the suite on any upstream change.
  "jsonschema>=4.26.0",
]

[project.scripts]
jenkins-mcp-server = "jenkins_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jenkins_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["jenkins_mcp_server"]
omit = [
  "src/jenkins_mcp_server/__main__.py",
  "src/jenkins_mcp_server/server.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
