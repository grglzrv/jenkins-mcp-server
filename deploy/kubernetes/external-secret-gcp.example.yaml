# Optional External Secrets Operator example. Adjust the ClusterSecretStore
# and Secret Manager keys to match your environment. ESO updates the Kubernetes
# Secret, but environment variables in existing pods do not change; restart the
# Deployment after a credential rotation. The target keys must remain
# JENKINS_USERNAME and JENKINS_TOKEN for the raw Deployment. Keep the two
# target keys and remote objects distinct unless two different properties are
# deliberately read from one structured provider secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-mcp-secrets
  namespace: jenkins-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: jenkins-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: JENKINS_USERNAME
      remoteRef:
        # Store the actual value matching {0} in Jenkins' LDAP User search filter.
        key: jenkins-mcp-user-id
    - secretKey: JENKINS_TOKEN
      remoteRef:
        key: jenkins-mcp-api-token
