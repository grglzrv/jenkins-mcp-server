# Optional External Secrets Operator example. Adjust the ClusterSecretStore
# and Secret Manager keys to match your environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-mcp-secrets
  namespace: jenkins-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: jenkins-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: JENKINS_USERNAME
      remoteRef:
        key: jenkins-mcp-username
    - secretKey: JENKINS_TOKEN
      remoteRef:
        key: jenkins-mcp-api-token
