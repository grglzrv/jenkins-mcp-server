# Base deployment with the minibridge proxy in front of the MCP server.
#
#   kubectl kustomize deploy/kubernetes/minibridge
#
# Differences from the plain base:
#   - the -minibridge image variant, which bundles minibridge and policy.rego
#   - Streamable HTTP at /mcp is served by Minibridge; its private Jenkins child
#     uses stdio inside the same container, matching Acuvity registry images
#   - health moves to 8080, and minibridge serves "/" rather than /healthz and /readyz
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jenkins-mcp
resources:
  - ../base
images:
  - name: ghcr.io/grglzrv/jenkins-mcp-server
    newTag: 2.10.2-minibridge
configMapGenerator:
  - name: jenkins-mcp-minibridge
    envs:
      - minibridge.env
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: jenkins-mcp
    patch: |-
      # Minibridge owns the client-facing Streamable HTTP endpoint and its
      # entrypoint supplies the private child transport, so base args must go.
      - op: remove
        path: /spec/template/spec/containers/0/args
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: jenkins-mcp-minibridge
      # The base uses a read-only root filesystem. minibridge resolves its XDG
      # config directory during startup, so provide a small writable mount.
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: minibridge-config
          mountPath: /home/app/.config
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: minibridge-config
          emptyDir:
            sizeLimit: 16Mi
      # minibridge health listens on 8080 and exposes "/" only.
      - op: replace
        path: /spec/template/spec/containers/0/ports/1/containerPort
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /
  - target:
      kind: Service
      name: jenkins-mcp
    patch: |-
      - op: replace
        path: /spec/ports/1/port
        value: 8080
