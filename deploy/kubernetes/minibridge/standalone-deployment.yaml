# Self-contained minibridge deployment: Secret, ConfigMap, Deployment, Service.
#
#   kubectl apply -f deploy/kubernetes/minibridge/standalone-deployment.yaml
#
# Everything is in one file so it can be read top to bottom. For anything beyond
# a demo, prefer the Helm chart or the kustomize overlay in this directory, and
# supply the Secret from External Secrets rather than committing it.
# NetworkPolicy is intentionally absent so an external Jenkins hostname remains
# reachable; add a policy only after modeling both client ingress and egress.
#
# Replace before applying:
#   - jenkins.example.com  -> your Jenkins URL
#   - the credentials in the Secret
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-mcp
---
# The credentials the server uses to talk to Jenkins. In production create this
# out of band, or have External Secrets create it, and delete this block: a
# Secret in Git is a Secret in your history.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-mcp-secrets
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp-minibridge
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jenkins-mcp
type: Opaque
stringData:
  # Actual value matching {0} in Jenkins' LDAP User search filter (often uid).
  JENKINS_USERNAME: replace-with-actual-jenkins-login-id
  # Generate the API token from that same Jenkins user.
  JENKINS_TOKEN: replace-with-jenkins-api-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-mcp-minibridge
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp-minibridge
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jenkins-mcp
data:
  JENKINS_URL: https://jenkins.example.com
  # Leave enabled. Only set JENKINS_CA_BUNDLE as well if Jenkins uses a private
  # or self-signed CA; a publicly issued certificate needs nothing.
  JENKINS_VERIFY_TLS: "true"
  JENKINS_TIMEOUT_SECONDS: "30"
  # Per replica. Excess requests wait up to the timeout above for a slot.
  JENKINS_MAX_CONCURRENCY: "10"
  JENKINS_MAX_RETRIES: "3"

  # Server-side policy. Enforced in-process, independent of minibridge.
  MCP_ALLOWED_JOBS: "AI/*,Platform/*"
  # Bound encoded requests and complete Jenkins API/config responses separately
  # from console text.
  MCP_MAX_REQUEST_BYTES: "10000000"
  MCP_MAX_RESPONSE_BYTES: "10000000"
  MCP_MAX_LOG_BYTES: "1000000"
  MCP_ALLOW_NODE_WRITE: "false"
  MCP_ALLOW_ADMIN_REQUEST: "false"
  MCP_ALLOW_SCRIPT_CONSOLE: "false"
  MCP_ALLOW_DESTRUCTIVE: "false"
  MCP_ALLOW_JOB_DELETE: "false"

  # Audit JSONL remains in process logs. This standalone manifest has no audit
  # volume, so the optional file copy and its rotation remain disabled.
  MCP_AUDIT_REQUIRED_FOR_READINESS: "false"
  MCP_AUDIT_MAX_BYTES: "0"
  MCP_AUDIT_BACKUP_COUNT: "0"

  # Minibridge owns the public MCP 2025-03-26 Streamable HTTP listener. Jenkins
  # runs on a private stdio pipe, so no server MCP_TRANSPORT or MCP_PORT is set.
  MINIBRIDGE_MODE: aio
  MINIBRIDGE_LISTEN: ":8000"
  MINIBRIDGE_HEALTH_LISTEN: ":8080"
  MINIBRIDGE_ENDPOINT_MCP: /mcp
  MINIBRIDGE_MCP_USE_TEMPDIR: "true"
  MINIBRIDGE_POLICER_ENFORCE: "true"

  # Tool policy. Empty means every tool is allowed, which is the default.
  # Groups: @read @write @destructive @admin @all
  TOOLS_DENY: "@destructive"
  TOOLS_ALLOW: ""
  METHODS_DENY: ""

  # Heuristic content guardrails, space separated. Empty disables them.
  GUARDRAILS: "covert-instruction-detection sensitive-pattern-detection secrets-redaction"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-mcp-minibridge
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp-minibridge
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jenkins-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-mcp-minibridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-mcp-minibridge
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: jenkins-mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # The -minibridge variant bundles minibridge and the Rego policy. The
          # plain image does not contain them, so this tag is required.
          image: ghcr.io/grglzrv/jenkins-mcp-server:2.9.6-minibridge
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                # Same termination drain as the direct-server deployment.
                command: ["/usr/bin/sleep", "5"]
          # No args: the entrypoint follows Acuvity's single-container pattern:
          # public Streamable HTTP in Minibridge, private stdio to Jenkins.
          envFrom:
            - configMapRef:
                name: jenkins-mcp-minibridge
            - secretRef:
                name: jenkins-mcp-secrets
          ports:
            - name: mcp
              containerPort: 8000
            - name: health
              containerPort: 8080
          # minibridge serves "/" on its health listener. It does not expose
          # /healthz or /readyz, which belong to the server's own health server.
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: minibridge-config
              mountPath: /home/app/.config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: minibridge-config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-mcp-minibridge
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp-minibridge
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jenkins-mcp
spec:
  type: ClusterIP
  # Minibridge keeps MCP session state in the process that accepted initialize.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 600
  selector:
    app.kubernetes.io/name: jenkins-mcp-minibridge
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
    - name: health
      port: 8080
      targetPort: health
