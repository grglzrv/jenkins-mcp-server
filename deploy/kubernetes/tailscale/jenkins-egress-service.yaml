apiVersion: v1
kind: Service
metadata:
  name: jenkins-tailnet
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-tailnet-egress
    app.kubernetes.io/part-of: jenkins-mcp
  annotations:
    # Replace with the full MagicDNS FQDN assigned to svc:jenkins.
    tailscale.com/tailnet-fqdn: jenkins.example-tailnet.ts.net
    tailscale.com/proxy-group: jenkins-egress
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP
