apiVersion: v1
kind: Service
metadata:
  name: jenkins-mcp
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jenkins-mcp
spec:
  type: ClusterIP
  # Streamable HTTP session state is process-local. Keep all requests carrying
  # one MCP session ID on the same replica.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 600
  selector:
    app.kubernetes.io/name: jenkins-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
