apiVersion: v1
kind: Service
metadata:
  name: jenkins-mcp
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp
    app.kubernetes.io/part-of: jenkins-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jenkins-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
