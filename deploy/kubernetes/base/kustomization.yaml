apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jenkins-mcp
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: jenkins-mcp-config
    envs:
      - config.env
generatorOptions:
  disableNameSuffixHash: true
commonLabels:
  app.kubernetes.io/managed-by: argocd
