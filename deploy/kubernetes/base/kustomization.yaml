apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jenkins-mcp
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  # No Ingress here: how the server is exposed is environment-specific. The
  # production overlay adds a Tailscale Ingress; add your own for another
  # controller.
  - pdb.yaml
# No NetworkPolicy here: a neutral base must not block a firewall-protected
# external Jenkins hostname. Add an environment-specific policy only after its
# client ingress and Jenkins egress paths are modeled; the Tailscale overlay
# includes one for its proxy path.
configMapGenerator:
  - name: jenkins-mcp-config
    envs:
      - config.env
generatorOptions:
  disableNameSuffixHash: true
commonLabels:
  app.kubernetes.io/managed-by: argocd
