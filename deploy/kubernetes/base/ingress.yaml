apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-mcp
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp
    app.kubernetes.io/part-of: jenkins-mcp
  annotations:
    tailscale.com/proxy-group: jenkins-mcp-ingress
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        # The operator uses the first label as the requested Tailscale Service name.
        - jenkins-mcp
  rules:
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: jenkins-mcp
                port:
                  name: mcp
