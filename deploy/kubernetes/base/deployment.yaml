apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-mcp
  namespace: jenkins-mcp
  labels:
    app.kubernetes.io/name: jenkins-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: jenkins-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-mcp
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: jenkins-mcp
    spec:
      serviceAccountName: jenkins-mcp
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jenkins-mcp
      containers:
        - name: server
          image: ghcr.io/grglzrv/jenkins-mcp-server:2.1.1
          imagePullPolicy: IfNotPresent
          args: ["--transport", "streamable-http"]
          envFrom:
            - configMapRef:
                name: jenkins-mcp-config
            - secretRef:
                name: jenkins-mcp-secrets
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
