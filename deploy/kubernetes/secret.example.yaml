# Example only. Do not commit real credentials. Raw manifests always reference
# this Secret; Helm's source selection exists only in the chart. In production
# create this object out of band or let an ExternalSecret create it, then
# restart the Deployment after rotation. These exact key names are the raw
# workload contract; Helm's usernameKey/tokenKey settings do not apply here.
# Never map both environment variables to the same Secret key.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-mcp-secrets
  namespace: jenkins-mcp
type: Opaque
stringData:
  # Actual value matching {0} in Jenkins' LDAP User search filter (often uid).
  JENKINS_USERNAME: replace-with-actual-jenkins-login-id
  # Generate the API token from that same Jenkins user.
  JENKINS_TOKEN: replace-with-jenkins-api-token
