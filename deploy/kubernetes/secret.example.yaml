# Example only. Do not commit real credentials. Raw manifests always reference
# this Secret; Helm's source selection exists only in the chart. In production
# create this object out of band or let an ExternalSecret create it, then
# restart the Deployment after rotation.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-mcp-secrets
  namespace: jenkins-mcp
type: Opaque
stringData:
  JENKINS_USERNAME: hermes-jenkins
  JENKINS_TOKEN: replace-with-jenkins-api-token
