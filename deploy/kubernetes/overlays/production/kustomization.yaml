apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../tailscale
  - ../../base
images:
  - name: ghcr.io/grglzrv/jenkins-mcp-server
    newName: ghcr.io/grglzrv/jenkins-mcp-server
    newTag: 2.6.3
patches:
  - target:
      kind: ConfigMap
      name: jenkins-mcp-config
    patch: |-
      - op: replace
        path: /data/JENKINS_URL
        value: https://jenkins.example-tailnet.ts.net
