jenkins:
  # Required: the Jenkins base URL.
  url: https://jenkins.example.com
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    existingSecret:
      enabled: false
    externalSecret:
      enabled: true
      targetUsernameKey: JENKINS_USERNAME
      targetTokenKey: JENKINS_TOKEN
      refreshInterval: 1h
      secretStoreRef:
        name: gcp-secret-store
        kind: ClusterSecretStore
      # Remote value matches {0} in Jenkins' LDAP User search filter.
      usernameRemoteKey: jenkins-mcp-user-id
      tokenRemoteKey: jenkins-mcp-token

mcp:
  maxResponseBytes: 10000000
  allowDestructive: false

audit:
  fileEnabled: false
  requiredForReadiness: false
  maxFileBytes: 52428800
  backupCount: 3

networkPolicy:
  # Jenkins is external and protected independently, so policy is opt-in.
  enabled: false
  allowSameNamespace: true
  allowInternetEgress: false
