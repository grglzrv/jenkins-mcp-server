jenkins:
  # Required: the Jenkins base URL.
  url: https://jenkins.example.com
  credentials:
    existingSecret:
      enabled: false
    externalSecret:
      enabled: true
      enabled: true
      refreshInterval: 1h
      secretStoreRef:
        name: gcp-secret-store
        kind: ClusterSecretStore
      usernameRemoteKey: jenkins-mcp-username
      tokenRemoteKey: jenkins-mcp-token

