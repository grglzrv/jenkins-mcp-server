replicaCount: 2

image:
  repository: ghcr.io/grglzrv/jenkins-mcp-server
  tag: "3.0.0"

service:
  # Streamable HTTP session state is process-local; keep requests on one pod.
  sessionAffinity:
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 600

ingress:
  enabled: true
  className: tailscale
  hostname: jenkins-mcp
  annotations:
    tailscale.com/proxy-group: jenkins-mcp-ingress

jenkins:
  url: https://jenkins.example-tailnet.ts.net
  verifyTls: true
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    existingSecret:
      enabled: true
      name: jenkins-mcp-secrets
  # No CA bundle here on purpose. Tailscale issues certificates that chain to a
  # public root, so the container's default trust store validates
  # jenkins.<tailnet>.ts.net already. Add caBundle.existingSecret only if your
  # Jenkins is fronted by a private CA instead.

mcp:
  readOnly: false
  allowJobWrite: true
  allowBuildWrite: true
  allowNodeWrite: false
  allowAdminRequest: false
  allowedJobs: "AI/*,Platform/*"

tailscale:
  # The integration is off by default; this example is the Tailscale path.
  enabled: true
  magicDNS:
    createDNSConfig: false
    name: ts-dns
  egress:
    enabled: true
    serviceName: jenkins-tailnet
    tailnetFQDN: jenkins.example-tailnet.ts.net
    proxyGroup: jenkins-egress
  proxyGroups:
    create: false
