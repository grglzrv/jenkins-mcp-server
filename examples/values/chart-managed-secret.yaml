# The chart creates the Secret from these values.
#
# Use this only for disposable environments. The token ends up in the Helm
# release, in `helm get values`, and in whatever holds this file. For anything
# real use examples/values/existing-secret.yaml or External Secrets.
#
#   helm install jenkins-mcp charts/jenkins-mcp-server -n jenkins-mcp \
#     -f examples/values/chart-managed-secret.yaml \
#     --set-string jenkins.credentials.create.jenkinsApiToken='<jenkins-api-token>'

jenkins:
  url: https://jenkins.example.com
  credentials:
    existingSecret:
      enabled: false
    create:
      enabled: true
      # Actual value matching {0} in Jenkins' LDAP User search filter. With
      # uid={0}, use the LDAP uid; otherwise use the configured attribute value.
      jenkinsUserId: "<actual-jenkins-login-id>"
      # Prefer --set on the command line over writing the token here.
      # REQUIRED: replace this empty value before installing.
      jenkinsApiToken: ""

mcp:
  allowedJobs: "AI/*"
  maxRequestBytes: 10000000
  maxResponseBytes: 10000000
  allowScriptConsole: false
  allowDestructive: false

audit:
  fileEnabled: false
  requiredForReadiness: false
  maxFileBytes: 52428800
  backupCount: 3

networkPolicy:
  # Disabled so the external, firewall-protected Jenkins URL remains reachable.
  # If you enable the policy, add a narrow egress rule or allow all egress.
  enabled: false
  allowSameNamespace: true
  allowInternetEgress: false
