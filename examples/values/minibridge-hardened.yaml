# Locked-down minibridge deployment: read-only tools, shared-secret auth, TLS.
#
#   helm install jenkins-mcp charts/jenkins-mcp-server -n jenkins-mcp \
#     -f examples/values/minibridge-hardened.yaml
#
# Prerequisites:
#   - Secret jenkins-mcp-secrets with JENKINS_USERNAME, JENKINS_TOKEN and
#     BASIC_AUTH_SECRET
#   - Secret jenkins-mcp-tls with tls.crt and tls.key
#
# basicAuth and the Jenkins credentials are deliberately separate Secrets. If
# you would rather keep one Secret and it is managed by External Secrets, add
# BASIC_AUTH_SECRET to externalSecret.extraData; the chart fails the render
# otherwise rather than producing a pod that cannot start.

# Minibridge remains available while terminating routing state propagates.
preStopDelaySeconds: 5

jenkins:
  url: https://jenkins.example.com
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    existingSecret:
      enabled: true
      name: jenkins-mcp-secrets
      usernameKey: JENKINS_USERNAME
      tokenKey: JENKINS_TOKEN

mcp:
  readOnly: true
  allowedJobs: "AI/*"
  maxResponseBytes: 10000000
  allowDestructive: false

service:
  # Minibridge sessions are process-local; keep requests on the initializing pod.
  sessionAffinity:
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 600

minibridge:
  enabled: true
  # TLS-protected client-facing Streamable HTTP at mcp.path (/mcp).
  mode: http
  tools:
    # Strict allowlist: nothing outside @read can be called or even listed.
    allow: ["@read"]
    deny: []
  methodsDeny: ["resources/read"]
  guardrails:
    - covert-instruction-detection
    - sensitive-pattern-detection
    - shadowing-pattern-detection
    - schema-misuse-prevention
    - cross-origin-tool-access
    - secrets-redaction
  policer:
    enforce: true
  basicAuth:
    # A shared secret callers must present to reach the proxy at all. This is
    # authentication for the MCP endpoint, unrelated to the Jenkins credentials:
    # a separate Secret keeps the two concerns apart.
    #
    #   kubectl -n jenkins-mcp create secret generic jenkins-mcp-proxy-auth \
    #     --from-literal=BASIC_AUTH_SECRET="$(openssl rand -hex 32)"
    enabled: true
    existingSecret: jenkins-mcp-proxy-auth
    secretKey: BASIC_AUTH_SECRET
  tls:
    enabled: true
    existingSecret: jenkins-mcp-tls
    certKey: tls.crt
    keyKey: tls.key
    # Set to enable mTLS, with the CA in the same Secret.
    clientCASecretKey: ""

audit:
  fileEnabled: false
  requiredForReadiness: false
  maxFileBytes: 52428800
  backupCount: 3

networkPolicy:
  # Jenkins is external and protected independently, so policy is opt-in.
  enabled: false
  allowSameNamespace: true
  allowInternetEgress: false
