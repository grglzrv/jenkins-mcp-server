# GCP Secret Manager via External Secrets Operator, with the chart creating the
# ClusterSecretStore as well as the ExternalSecret.
#
# Prerequisites in GCP:
#   1. Secrets exist in Secret Manager (see remote keys below).
#   2. A Google service account (GSA) with roles/secretmanager.secretAccessor on
#      those secrets.
#   3. Workload Identity binding from the Kubernetes SA below to that GSA:
#        gcloud iam service-accounts add-iam-policy-binding GSA_EMAIL \
#          --role roles/iam.workloadIdentityUser \
#          --member "serviceAccount:CLUSTER_PROJECT.svc.id.goog[jenkins-mcp/jenkins-mcp-server]"
#   4. The GSA also needs roles/iam.serviceAccountTokenCreator when ESO
#      impersonates it via serviceAccountRef (not needed for pod-attached WI).
#
# Install:
#   helm install jenkins-mcp charts/jenkins-mcp-server -n jenkins-mcp \
#     -f examples/values/external-secrets-gcp-workload-identity.yaml

# Pin the resource names so the Kubernetes SA is predictably
# "jenkins-mcp-server" and matches serviceAccountRef / the Workload Identity
# binding below. Without this the SA is named <release>-jenkins-mcp-server.
fullnameOverride: jenkins-mcp-server

jenkins:
  url: https://jenkins.example.com
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    # Managed by External Secrets, so no Helm-created Secret and no existingSecret.
    existingSecret:
      enabled: false
    externalSecret:
      enabled: true
      targetUsernameKey: JENKINS_USERNAME
      targetTokenKey: JENKINS_TOKEN
      apiVersion: external-secrets.io/v1
      refreshInterval: 1h

      secretStoreRef:
        name: jenkins-mcp-gcpsm
        # Must match secretStore.kind below.
        kind: ClusterSecretStore

      secretStore:
        create: true
        kind: ClusterSecretStore
        provider:
          gcpsm:
            # Project that holds the Secret Manager secrets.
            projectID: secrets-project-456
            auth:
              workloadIdentity:
                # Recent ESO versions can auto-detect these from the GKE metadata
                # server; they are set explicitly here so the store also works on
                # clusters where detection is unavailable.
                clusterProjectID: cluster-project-123
                clusterName: production
                clusterLocation: europe-west1
                serviceAccountRef:
                  name: jenkins-mcp-server
                  # Required for ClusterSecretStore: a cluster-scoped store has no
                  # namespace of its own, so ESO cannot resolve the SA without it.
                  namespace: jenkins-mcp

      creationPolicy: Owner
      deletionPolicy: Retain

      # Secret Manager secret names.
      # Remote value matches {0} in Jenkins' LDAP User search filter.
      usernameRemoteKey: jenkins-mcp-user-id
      tokenRemoteKey: jenkins-mcp-token
      # If instead one secret holds JSON like {"username":"...","token":"..."},
      # point both keys at it and select the fields:
      #   usernameRemoteKey: jenkins-mcp-credentials
      #   tokenRemoteKey: jenkins-mcp-credentials
      #   usernameRemoteProperty: username
      #   tokenRemoteProperty: token


serviceAccount:
  create: true
  annotations:
    # Ties this Kubernetes SA to the Google service account.
    iam.gke.io/gcp-service-account: jenkins-mcp-eso@cluster-project-123.iam.gserviceaccount.com

mcp:
  allowedJobs: "AI/*,Platform/*"
  maxResponseBytes: 10000000
  # Destructive actions stay off in this example.
  allowDestructive: false
  allowJobDelete: false

audit:
  fileEnabled: false
  requiredForReadiness: false
  maxFileBytes: 52428800
  backupCount: 3

networkPolicy:
  # Jenkins is external and protected independently, so policy is opt-in.
  enabled: false
  allowSameNamespace: true
  allowInternetEgress: false
