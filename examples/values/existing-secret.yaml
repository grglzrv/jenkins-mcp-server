# Simplest production-shaped setup: you create the Kubernetes Secret yourself
# (or your platform does), and the chart only references it.
#
# Create the Secret first:
#
#   kubectl create secret generic jenkins-mcp-secrets \
#     --namespace jenkins-mcp \
#     --from-literal=JENKINS_USERNAME='hermes-jenkins' \
#     --from-literal=JENKINS_TOKEN='<jenkins-api-token>'
#
# Then:
#
#   helm install jenkins-mcp oci://ghcr.io/grglzrv/charts/jenkins-mcp-server \
#     -n jenkins-mcp -f examples/values/existing-secret.yaml
#
# The chart never sees the token: it is injected into the pod with secretKeyRef.

jenkins:
  url: https://jenkins.example-tailnet.ts.net
  credentials:
    # Name of the Secret you created above.
    existingSecret: jenkins-mcp-secrets
    # Key names inside it. Change these if your Secret uses different keys,
    # e.g. usernameKey: username / tokenKey: api-token
    usernameKey: JENKINS_USERNAME
    tokenKey: JENKINS_TOKEN
    # Leave false: this is what makes the chart use your Secret rather than
    # creating one of its own.
    create: false

mcp:
  allowedJobs: "AI/*,Platform/*"
