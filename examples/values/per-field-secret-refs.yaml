# Read the Jenkins username and API token from separate existing Secrets.
# This is useful when an operator rotates the token independently from the
# service identity. The chart never reads or stores either value.
jenkins:
  url: https://jenkins.example.com
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    existingSecret:
      enabled: false
    # Each field from its own Secret, for when the username and token are
    # managed separately.
    secretKeyRefs:
      enabled: true
      username:
        name: jenkins-service-identity
        key: username
      token:
        name: jenkins-api-token
        key: token

