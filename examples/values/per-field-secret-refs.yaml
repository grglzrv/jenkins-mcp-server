# Advanced case: read the Jenkins user ID and API token from separate Secrets.
# This is useful when an operator rotates the token independently from the
# service identity. If both values are in one Secret, use existingSecret.yaml
# instead. The chart never reads or stores either value.
jenkins:
  url: https://jenkins.example.com
  credentials:
    # The chart creates the Secret by default; this deployment supplies its own.
    create:
      enabled: false
    existingSecret:
      enabled: false
    # Each field from a different Secret object.
    secretKeyRefs:
      enabled: true
      username:
        name: jenkins-service-identity
        key: username
      token:
        name: jenkins-api-token
        key: token

mcp:
  maxRequestTargetBytes: 8192
  maxRequestBytes: 10000000
  maxResponseBytes: 10000000
  allowScriptConsole: false
  allowDestructive: false

audit:
  fileEnabled: false
  requiredForReadiness: false
  maxFileBytes: 52428800
  backupCount: 3

networkPolicy:
  # Jenkins is external and protected independently, so policy is opt-in.
  enabled: false
  allowSameNamespace: true
  allowInternetEgress: false
